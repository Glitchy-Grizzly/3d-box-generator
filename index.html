<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Print-in-Place Hinged Box Generator</title>
    <style>
        :root {
            --bg-color: #1a1a2e;
            --panel-bg: #16213e;
            --accent: #0f3460;
            --neon: #e94560;
            --text: #e0e0e0;
        }
        body {
            margin: 0;
            padding: 0;
            display: flex;
            height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            overflow: hidden;
        }
        #sidebar {
            width: 350px;
            background-color: var(--panel-bg);
            padding: 20px;
            box-shadow: 2px 0 10px rgba(0,0,0,0.5);
            overflow-y: auto;
            z-index: 10;
            box-sizing: border-box;
        }
        #viewer {
            flex-grow: 1;
            position: relative;
        }
        h1 {
            color: var(--neon);
            font-size: 1.5rem;
            text-align: center;
            margin-top: 0;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .control-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            font-size: 0.9rem;
            color: #aaa;
        }
        input[type="range"], input[type="text"], select {
            width: 100%;
            padding: 8px;
            background: var(--bg-color);
            border: 1px solid var(--accent);
            color: white;
            border-radius: 4px;
            box-sizing: border-box;
        }
        input[type="range"] {
            padding: 0;
        }
        .value-display {
            float: right;
            color: var(--neon);
            font-weight: bold;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: var(--neon);
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 10px;
        }
        button:hover {
            background-color: #ff5c77;
        }
        button.etsy-btn {
            background-color: #f1641e;
            margin-top: 15px;
        }
        button.etsy-btn:hover {
            background-color: #ff7d3b;
        }
    </style>
    <!-- Three.js for 3D Preview -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div id="sidebar">
        <h1>Box Generator</h1>
       
        <div class="control-group">
            <label>Width <span class="value-display" id="valWidth">120</span></label>
            <input type="range" id="width" min="30" max="200" value="120">
        </div>
        <div class="control-group">
            <label>Length (Each Half) <span class="value-display" id="valLength">90</span></label>
            <input type="range" id="length" min="40" max="100" value="90">
        </div>
        <div class="control-group">
            <label>Height (Each Half) <span class="value-display" id="valHeight">20</span></label>
            <input type="range" id="height" min="10" max="50" value="20">
        </div>
        <div class="control-group">
            <label>Wall Thickness <span class="value-display" id="valWall">2</span></label>
            <input type="range" id="wall" min="1.2" max="4" step="0.2" value="2">
        </div>
        <div class="control-group">
            <label>Compartments X <span class="value-display" id="valCompX">2</span></label>
            <input type="range" id="compX" min="1" max="5" value="2">
        </div>
        <div class="control-group">
            <label>Compartments Y <span class="value-display" id="valCompY">1</span></label>
            <input type="range" id="compY" min="1" max="5" value="1">
        </div>
        <div class="control-group">
            <label>Custom Text</label>
            <input type="text" id="customText" value="MY GAME" placeholder="Top Lid Text">
        </div>
        <div class="control-group">
            <label for="fontSelect">Font</label>
            <select id="fontSelect">
                <option value="Impact">Impact</option>
                <option value="Arial Black">Arial Black</option>
                <option value="Trebuchet MS">Trebuchet MS</option>
                <option value="Courier New">Courier New</option>
            </select>
        </div>

        <button onclick="downloadSCAD()">Download OpenSCAD File</button>
        <button class="etsy-btn" onclick="saveBoxAndRedirect()">Order Custom Box on Etsy</button>
    </div>

    <div id="viewer"></div>

    <!-- Firebase SDK Setup -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // ⚠️ REPLACE THIS OBJECT WITH YOUR CONFIG FROM FIREBASE CONSOLE PROJECT SETTINGS
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_ID.appspot.com",
            messagingSenderId: "123456789",
            appId: "1:123456789:web:abcdef"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Attach function to global window so the Etsy button can call it
        window.saveBoxAndRedirect = async function() {
            const boxParams = {
                width: parseFloat(document.getElementById('width').value),
                length: parseFloat(document.getElementById('length').value),
                height: parseFloat(document.getElementById('height').value),
                wall: parseFloat(document.getElementById('wall').value),
                compX: parseInt(document.getElementById('compX').value),
                compY: parseInt(document.getElementById('compY').value),
                customText: document.getElementById('customText').value,
                font: document.getElementById('fontSelect').value,
                scadCode: currentScadCode,
                createdAt: new Date().toISOString()
            };

            const designId = "BOX-" + Math.random().toString(36).substring(2, 8).toUpperCase();

            try {
                // Save box configuration into Firestore collection "custom_boxes"
                await setDoc(doc(db, "custom_boxes", designId), boxParams);

                // Copy Design ID to clipboard
                await navigator.clipboard.writeText(designId);

                alert(`Design Code ${designId} copied to clipboard!\n\nPlease paste this code into the Personalization field on Etsy.`);

                // REPLACE THIS URL WITH YOUR ETSY SHOP OR SPECIFIC LISTING URL
                window.location.href = "https://www.etsy.com/shop/YourShopName";

            } catch (error) {
                console.error("Error saving design to Firebase:", error);
                alert("Could not save design. Please make sure your Firebase keys are set correctly.");
            }
        };
    </script>

    <script>
        // Store current generated SCAD string internally
        let currentScadCode = "";

        // --- 3D Viewer Setup ---
        const container = document.getElementById('viewer');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a2e);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 150, 150);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxPolarAngle = Math.PI;

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(50, 100, 50);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // Grid helper
        const gridHelper = new THREE.GridHelper(300, 30, 0x0f3460, 0x222222);
        scene.add(gridHelper);

        let boxGroup = new THREE.Group();
        scene.add(boxGroup);

        // Helper function to build a hollow box with internal compartments
        function buildBoxHalf(w, l, h, t, cx, cy, mat) {
            const group = new THREE.Group();
           
            // Floor
            const floor = new THREE.Mesh(new THREE.BoxGeometry(w, l, t), mat);
            floor.position.set(0, 0, t/2);
            group.add(floor);

            // Outer Walls
            const left = new THREE.Mesh(new THREE.BoxGeometry(t, l, h), mat);
            left.position.set(-w/2 + t/2, 0, h/2);
            group.add(left);

            const right = new THREE.Mesh(new THREE.BoxGeometry(t, l, h), mat);
            right.position.set(w/2 - t/2, 0, h/2);
            group.add(right);

            const front = new THREE.Mesh(new THREE.BoxGeometry(w - t*2, t, h), mat);
            front.position.set(0, -l/2 + t/2, h/2);
            group.add(front);

            const back = new THREE.Mesh(new THREE.BoxGeometry(w - t*2, t, h), mat);
            back.position.set(0, l/2 - t/2, h/2);
            group.add(back);

            // Compartment Dividers
            if (cx > 1) {
                const cw = (w - t * (cx + 1)) / cx;
                for (let i = 1; i < cx; i++) {
                    const div = new THREE.Mesh(new THREE.BoxGeometry(t, l - t*2, h), mat);
                    div.position.set(-w/2 + t + i*cw + (i-0.5)*t, 0, h/2);
                    group.add(div);
                }
            }
            if (cy > 1) {
                const cl = (l - t * (cy + 1)) / cy;
                for (let i = 1; i < cy; i++) {
                    const div = new THREE.Mesh(new THREE.BoxGeometry(w - t*2, t, h), mat);
                    div.position.set(0, -l/2 + t + i*cl + (i-0.5)*t, h/2);
                    group.add(div);
                }
            }
           
            return group;
        }

        // --- Model Generation Logic ---
        function updateModel() {
            const width = parseFloat(document.getElementById('width').value);
            const length = parseFloat(document.getElementById('length').value);
            const height = parseFloat(document.getElementById('height').value);
            const wall = parseFloat(document.getElementById('wall').value);
            const compX = parseInt(document.getElementById('compX').value);
            const compY = parseInt(document.getElementById('compY').value);
            const customText = document.getElementById('customText').value;
            const font = document.getElementById('fontSelect').value;

            // Update UI Labels
            document.getElementById('valWidth').innerText = width;
            document.getElementById('valLength').innerText = length;
            document.getElementById('valHeight').innerText = height;
            document.getElementById('valWall').innerText = wall;
            document.getElementById('valCompX').innerText = compX;
            document.getElementById('valCompY').innerText = compY;

            // Rebuild 3D Preview
            scene.remove(boxGroup);
            boxGroup = new THREE.Group();

            const material = new THREE.MeshStandardMaterial({
                color: 0xe94560,
                roughness: 0.4,
                metalness: 0.1
            });
            const hingeMaterial = new THREE.MeshStandardMaterial({ color: 0x0f3460 });

            const gap = 0.5; // PiP separation gap

            // Base Box
            const baseGroup = buildBoxHalf(width, length, height, wall, compX, compY, material);
            baseGroup.position.set(0, -length/2 - gap/2, 0);
           
            // Printable ramp latch wedge on outer base wall
            const wedgeShape = new THREE.Shape();
            wedgeShape.moveTo(0, 0);
            wedgeShape.lineTo(wall * 1.5, wall * 1.5);
            wedgeShape.lineTo(0, wall * 1.5);
            wedgeShape.closePath();

            const extrudeSettings = { depth: width/4, bevelEnabled: false };
            const wedgeGeo = new THREE.ExtrudeGeometry(wedgeShape, extrudeSettings);
            const wedge = new THREE.Mesh(wedgeGeo, material);
            wedge.rotation.x = Math.PI / 2;
            wedge.rotation.y = Math.PI / 2;
            wedge.position.set(-width/8, -length/2 - wall/2, height - wall * 2);
            baseGroup.add(wedge);
           
            boxGroup.add(baseGroup);

            // Lid Box
            const lidGroup = buildBoxHalf(width, length, height, wall, 1, 1, material);
            lidGroup.position.set(0, length/2 + gap/2, 0);
           
            // Lid Latch Arm (Cantilever Snap-fit)
            const latchGroup = new THREE.Group();
            const armW = width / 4;
            const armT = wall;
           
            const armLow = new THREE.Mesh(new THREE.BoxGeometry(armW, armT, height), material);
            armLow.position.set(0, 0, height/2);
            latchGroup.add(armLow);
           
            const strutL = new THREE.Mesh(new THREE.BoxGeometry(wall, armT, wall*2), material);
            strutL.position.set(-armW/2 + wall/2, 0, height + wall);
            latchGroup.add(strutL);
            const strutR = new THREE.Mesh(new THREE.BoxGeometry(wall, armT, wall*2), material);
            strutR.position.set(armW/2 - wall/2, 0, height + wall);
            latchGroup.add(strutR);
           
            const cap = new THREE.Mesh(new THREE.BoxGeometry(armW, armT, wall), material);
            cap.position.set(0, 0, height + wall*2.5);
            latchGroup.add(cap);
           
            latchGroup.position.set(0, length/2 + armT/2, 0);
            lidGroup.add(latchGroup);

            boxGroup.add(lidGroup);

            // Segmented Hinge Preview
            const hingeRadius = wall;
            const knuckle_w = width / 5;
           
            for(let i of [-2, -1, 0, 1, 2]) {
                const kGeo = new THREE.CylinderGeometry(hingeRadius, hingeRadius, knuckle_w - 0.5, 16);
                const kMesh = new THREE.Mesh(kGeo, hingeMaterial);
                kMesh.rotation.z = Math.PI / 2;
                kMesh.position.set(i * knuckle_w, 0, height);
                boxGroup.add(kMesh);
               
                const anchorGeo = new THREE.BoxGeometry(knuckle_w - 0.5, wall * 2 + gap, hingeRadius * 2);
                const anchorMesh = new THREE.Mesh(anchorGeo, material);
                let yOffset = (i % 2 === 0) ? -wall : wall;
                anchorMesh.position.set(i * knuckle_w, yOffset/2, height - hingeRadius/2);
                boxGroup.add(anchorMesh);
            }

            // Text Overlay facing latch side when closed
            if(customText) {
                const canvas = document.createElement('canvas');
                canvas.width = 1024;
                canvas.height = 1024;
                const ctx = canvas.getContext('2d');
               
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.font = `bold 120px "${font}"`;
                ctx.fillStyle = '#111111';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
               
                ctx.fillText(customText, canvas.width/2, canvas.height/2);

                const tex = new THREE.CanvasTexture(canvas);
                tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
               
                const textGeo = new THREE.PlaneGeometry(width - wall*2, length - wall*2);
                const textMat = new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthWrite: false });
                const textMesh = new THREE.Mesh(textGeo, textMat);
               
                textMesh.position.set(0, length/2 + gap/2, -0.01);
                textMesh.rotation.x = Math.PI;
                textMesh.rotation.z = 0; // Oriented correctly facing the latch side
               
                boxGroup.add(textMesh);
            }

            // Rotate entire group so Z points UP relative to the Three.js Y-UP world
            boxGroup.rotation.x = -Math.PI / 2;

            scene.add(boxGroup);

            // Update OpenSCAD logic
            generateSCAD(width, length, height, wall, compX, compY, customText, font, gap);
        }

        function generateSCAD(w, l, h, wall, cx, cy, text, font, gap) {
            currentScadCode = `
// Print-in-Place Hinged Box with Snap-Fit Latch
// Auto-generated

width = ${w};
length = ${l};
height = ${h};
wall = ${wall};
compX = ${cx};
compY = ${cy};
gap = ${gap}; // Print-in-place separation gap
tol = 0.3; // Printer tolerance
$fn = 60;

// Text Parameters
box_text = "${text}";
font_style = "${font}:style=Bold";

module main() {
    translate([0, -length/2 - gap/2, 0]) base_box();
    translate([0, length/2 + gap/2, 0]) lid_box();
    build_hinges();
}

module base_box() {
    union() {
        difference() {
            translate([-width/2, -length/2, 0]) cube([width, length, height]);
           
            comp_w = (width - wall * (compX + 1)) / compX;
            comp_l = (length - wall * (compY + 1)) / compY;
           
            for(i=[0:compX-1]) {
                for(j=[0:compY-1]) {
                    translate([
                        -width/2 + wall + i*(comp_w+wall),
                        -length/2 + wall + j*(comp_l+wall),
                        wall
                    ])
                    cube([comp_w, comp_l, height]);
                }
            }
           
            translate([-width/2-1, length/2 - wall, height - wall])
            cube([width+2, wall+1, wall+1]);
        }
       
        // Ramp catch wedge positioned on the outer front wall
        translate([-width/8, -length/2 - wall, height - wall*2])
        rotate([0, 90, 0])
        linear_extrude(width/4)
        polygon([[0,0], [wall*1.5, wall*1.5], [0, wall*1.5]]);
    }
}

module lid_box() {
    difference() {
        union() {
            translate([-width/2, -length/2, 0]) cube([width, length, height]);
           
            translate([-width/8, length/2, 0])
            cube([width/4, wall, height + wall*3]);
        }
       
        translate([-width/2 + wall, -length/2 + wall, wall])
        cube([width - wall*2, length - wall*2, height]);
       
        translate([-width/2-1, -length/2 - 1, height - wall])
        cube([width+2, wall+1, wall+1]);
       
        translate([-width/8 - 1, length/2 - 0.5, height])
        cube([width/4 + 2, wall + 1, wall*2 + tol]);
       
        // Text Deboss oriented towards the latch side when closed
        if (box_text != "") {
            translate([0, 0, -0.1])
            rotate([0, 180, 0])
            linear_extrude(1)
            text(box_text, font=font_style, size=min(width/5, length/(len(box_text)*0.8)), halign="center", valign="center");
        }
    }
}

module build_hinges() {
    module teardrop(r, l) {
        rotate([0, 90, 0])
        linear_extrude(l, center=true)
        polygon([
            [0, -r], [r, 0], [0, r], [-r*0.7, r*0.7], [-r, 0], [-r*0.7, -r*0.7]
        ]);
    }

    knuckle_w = width / 5;
    hr = wall;
   
    for(i=[-2, 0, 2]) {
        translate([i * knuckle_w, 0, height]) {
            translate([0, -gap/2 - wall/2, -hr/2])
            cube([knuckle_w - tol, wall + gap, hr], center=true);
            teardrop(hr - tol, knuckle_w - tol);
        }
    }
   
    for(i=[-1, 1]) {
        translate([i * knuckle_w, 0, height]) {
            difference() {
                union() {
                    rotate([0, 90, 0]) cylinder(r=hr, h=knuckle_w - tol, center=true);
                    translate([0, gap/2 + wall/2, -hr/2])
                    cube([knuckle_w - tol, wall + gap, hr], center=true);
                }
                teardrop(hr + tol/2, knuckle_w + 1);
            }
        }
    }
}

main();
`;
        }

        function downloadSCAD() {
            const blob = new Blob([currentScadCode], { type: "text/plain" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = "pip_hinged_box.scad";
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        // Event Listeners
        const inputs = document.querySelectorAll('input, select');
        inputs.forEach(input => input.addEventListener('input', updateModel));

        // Animation Loop
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        // Window resize handler
        window.addEventListener('resize', () => {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        });

        // Init
        updateModel();
        animate();
    </script>
</body>
</html>
