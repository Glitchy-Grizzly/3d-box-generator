<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Print-in-Place Hinged Box Generator</title>
    <link rel="icon" type="image/png" href="bear head 1024x1024.png">
    <style>
        :root {
            --bg-color: #1a1a2e;
            --panel-bg: #16213e;
            --accent: #0f3460;
            --neon: #e94560;
            --text: #e0e0e0;
        }
        body {
            margin: 0;
            padding: 0;
            display: flex;
            height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            overflow: hidden;
        }
        #sidebar {
            width: 350px;
            background-color: var(--panel-bg);
            padding: 20px;
            box-shadow: 2px 0 10px rgba(0,0,0,0.5);
            overflow-y: auto;
            z-index: 10;
            box-sizing: border-box;
        }
        #viewer {
            flex-grow: 1;
            position: relative;
        }
        h1 {
            color: var(--neon);
            font-size: 1.5rem;
            text-align: center;
            margin-top: 0;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .control-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            font-size: 0.9rem;
            color: #aaa;
        }
        input[type="range"], input[type="text"], select {
            width: 100%;
            padding: 8px;
            background: var(--bg-color);
            border: 1px solid var(--accent);
            color: white;
            border-radius: 4px;
            box-sizing: border-box;
        }
        input[type="range"] {
            padding: 0;
        }
        .value-display {
            float: right;
            color: var(--neon);
            font-weight: bold;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: var(--neon);
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 10px;
        }
        button:hover {
            background-color: #ff5c77;
        }
        button.etsy-btn {
            background-color: #f1641e;
            margin-top: 15px;
        }
        button.etsy-btn:hover {
            background-color: #ff7d3b;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div id="sidebar">
        <h1>Box Generator</h1>
       
        <div class="control-group">
            <label>Width <span class="value-display" id="valWidth">120</span></label>
            <input type="range" id="width" min="40" max="200" value="120">
        </div>
        <div class="control-group">
            <label>Length (Each Half) <span class="value-display" id="valLength">90</span></label>
            <input type="range" id="length" min="40" max="150" value="90">
        </div>
        <div class="control-group">
            <label>Height (Each Half) <span class="value-display" id="valHeight">20</span></label>
            <input type="range" id="height" min="10" max="60" value="20">
        </div>

        <input type="hidden" id="wall" value="2.0">

        <div class="control-group">
            <label>Compartments X <span class="value-display" id="valCompX">2</span></label>
            <input type="range" id="compX" min="1" max="5" value="2">
        </div>
        <div class="control-group">
            <label>Compartments Y <span class="value-display" id="valCompY">1</span></label>
            <input type="range" id="compY" min="1" max="5" value="1">
        </div>

        <div class="control-group">
            <label for="boxColorSelect">Box Color (Bambu PLA)</label>
            <select id="boxColorSelect">
                <option value="#C12E1F">Red</option>
                <option value="#000000">Black</option>
                <option value="#FFFFFF">White (Jade White)</option>
                <option value="#F4EE2A">Yellow</option>
                <option value="#0A2989">Blue</option>
                <option value="#3F8E43">Dark Green (Mistletoe)</option>
                <option value="#8E9089">Gray</option>
                <option value="#6F5034">Cocoa Brown</option>
                <option value="#E4BD68">Gold</option>
                <option value="#5E43B7">Purple</option>
                <option value="#F5547C" selected>Hot Pink</option>
            </select>
        </div>

        <div class="control-group">
            <label for="textColorSelect">Text & Inlay Color (Bambu PLA)</label>
            <select id="textColorSelect">
                <option value="#000000" selected>Black</option>
                <option value="#FFFFFF">White (Jade White)</option>
                <option value="#F4EE2A">Yellow</option>
                <option value="#C12E1F">Red</option>
                <option value="#0A2989">Blue</option>
                <option value="#3F8E43">Dark Green (Mistletoe)</option>
                <option value="#8E9089">Gray</option>
                <option value="#6F5034">Cocoa Brown</option>
                <option value="#E4BD68">Gold</option>
                <option value="#5E43B7">Purple</option>
                <option value="#F5547C">Hot Pink</option>
            </select>
        </div>

        <div class="control-group">
            <label>Custom Text</label>
            <input type="text" id="customText" value="MY GAME" placeholder="Top Lid Text">
        </div>
        <div class="control-group">
            <label for="fontSelect">Font</label>
            <select id="fontSelect">
                <option value="Impact">Impact</option>
                <option value="Arial Black">Arial Black</option>
                <option value="Trebuchet MS">Trebuchet MS</option>
                <option value="Courier New">Courier New</option>
            </select>
        </div>

        <div class="control-group" style="text-align: center; margin-top: 15px; padding: 10px; background: rgba(255,255,255,0.05); border-radius: 6px;">
            <label style="color: #aaa; margin-bottom: 2px;">Etsy Order Tier:</label>
            <div id="recommendedTier" style="font-size: 1.1rem; font-weight: bold; color: var(--neon);">Small Box (0 cm³)</div>
        </div>

        <button onclick="downloadSCAD()">Download OpenSCAD File</button>
        <button class="etsy-btn" onclick="saveBoxAndRedirect()">Order Custom Box on Etsy</button>
    </div>

    <div id="viewer"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_ID.appspot.com",
            messagingSenderId: "123456789",
            appId: "1:123456789:web:abcdef"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.saveBoxAndRedirect = async function() {
            const boxParams = {
                shape: "rectangle",
                width: parseFloat(document.getElementById('width').value),
                length: parseFloat(document.getElementById('length').value),
                height: parseFloat(document.getElementById('height').value),
                wall: 2.0,
                compX: parseInt(document.getElementById('compX').value),
                compY: parseInt(document.getElementById('compY').value),
                boxColor: document.getElementById('boxColorSelect').value,
                textColor: document.getElementById('textColorSelect').value,
                customText: document.getElementById('customText').value,
                font: document.getElementById('fontSelect').value,
                scadCode: currentScadCode,
                createdAt: new Date().toISOString()
            };

            const designId = "BOX-" + Math.random().toString(36).substring(2, 8).toUpperCase();

            try {
                await setDoc(doc(db, "custom_boxes", designId), boxParams);
                await navigator.clipboard.writeText(designId);
                alert(`Design Code ${designId} copied to clipboard!\n\nPlease paste this code into the Personalization field on Etsy.`);
                window.location.href = "https://www.etsy.com/shop/YourShopName";
            } catch (error) {
                console.error("Error saving design to Firebase:", error);
                alert("Could not save design. Please make sure your Firebase keys are set correctly.");
            }
        };
    </script>

    <script>
        let currentScadCode = "";

        const container = document.getElementById('viewer');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a2e);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 150, 150);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(50, 100, 50);
        dirLight.castShadow = true;
        scene.add(dirLight);

        const gridHelper = new THREE.GridHelper(300, 30, 0x0f3460, 0x222222);
        scene.add(gridHelper);

        let boxGroup = new THREE.Group();
        scene.add(boxGroup);

        function buildBoxHalf(w, l, h, t, cx, cy, mat) {
            const group = new THREE.Group();
           
            const floor = new THREE.Mesh(new THREE.BoxGeometry(w, l, t), mat);
            floor.position.set(0, 0, t/2);
            group.add(floor);

            const left = new THREE.Mesh(new THREE.BoxGeometry(t, l, h), mat);
            left.position.set(-w/2 + t/2, 0, h/2);
            group.add(left);

            const right = new THREE.Mesh(new THREE.BoxGeometry(t, l, h), mat);
            right.position.set(w/2 - t/2, 0, h/2);
            group.add(right);

            const front = new THREE.Mesh(new THREE.BoxGeometry(w - t*2, t, h), mat);
            front.position.set(0, -l/2 + t/2, h/2);
            group.add(front);

            const back = new THREE.Mesh(new THREE.BoxGeometry(w - t*2, t, h), mat);
            back.position.set(0, l/2 - t/2, h/2);
            group.add(back);

            if (cx > 1) {
                const cw = (w - t * (cx + 1)) / cx;
                for (let i = 1; i < cx; i++) {
                    const div = new THREE.Mesh(new THREE.BoxGeometry(t, l - t*2, h), mat);
                    div.position.set(-w/2 + t + i*cw + (i-0.5)*t, 0, h/2);
                    group.add(div);
                }
            }
            if (cy > 1) {
                const cl = (l - t * (cy + 1)) / cy;
                for (let i = 1; i < cy; i++) {
                    const div = new THREE.Mesh(new THREE.BoxGeometry(w - t*2, t, h), mat);
                    div.position.set(0, -l/2 + t + i*cl + (i-0.5)*t, h/2);
                    group.add(div);
                }
            }
           
            return group;
        }

        function updateModel() {
            const width = parseFloat(document.getElementById('width').value);
            const length = parseFloat(document.getElementById('length').value);
            const height = parseFloat(document.getElementById('height').value);
            const wall = 2.0;
            const compX = parseInt(document.getElementById('compX').value);
            const compY = parseInt(document.getElementById('compY').value);
            const boxColorHex = document.getElementById('boxColorSelect').value;
            const textColorHex = document.getElementById('textColorSelect').value;
            const customText = document.getElementById('customText').value;
            const font = document.getElementById('fontSelect').value;

            document.getElementById('valWidth').innerText = width;
            document.getElementById('valLength').innerText = length;
            document.getElementById('valHeight').innerText = height;
            document.getElementById('valCompX').innerText = compX;
            document.getElementById('valCompY').innerText = compY;

            const totalVolumeCm3 = (width * (length * 2) * height) / 1000;
            let tier = "Small Box";

            if (totalVolumeCm3 > 900) {
                tier = "Extra Large Box";
            } else if (totalVolumeCm3 > 450) {
                tier = "Large Box";
            } else if (totalVolumeCm3 > 150) {
                tier = "Medium Box";
            }

            if (compX > 2 || compY > 2) {
                tier += " (+ Divider Add-on)";
            }

            const tierDisplay = document.getElementById('recommendedTier');
            if (tierDisplay) {
                tierDisplay.innerText = `${tier} (${Math.round(totalVolumeCm3)} cm³)`;
            }

            scene.remove(boxGroup);
            boxGroup = new THREE.Group();

            const material = new THREE.MeshStandardMaterial({
                color: new THREE.Color(boxColorHex),
                roughness: 0.4,
                metalness: 0.1
            });
            const pinMaterial = new THREE.MeshStandardMaterial({
                color: 0x333333,
                roughness: 0.2
            });

            const gap = 1.0;

            // Base Box Half
            const baseGroup = buildBoxHalf(width, length, height, wall, compX, compY, material);
            baseGroup.position.set(0, -length/2 - gap/2, 0);
           
            const wedgeShape = new THREE.Shape();
            wedgeShape.moveTo(0, 0);
            wedgeShape.lineTo(wall * 1.2, 0);
            wedgeShape.lineTo(0, wall * 1.2);
            wedgeShape.closePath();

            const wedgeGeo = new THREE.ExtrudeGeometry(wedgeShape, { depth: width/5, bevelEnabled: false });
            const wedge = new THREE.Mesh(wedgeGeo, material);
            wedge.rotation.x = Math.PI / 2;
            wedge.rotation.y = Math.PI / 2;
            wedge.position.set(-width/10, -length/2 - wall/2, height - wall * 1.5);
            baseGroup.add(wedge);
           
            boxGroup.add(baseGroup);

            // Lid Box Half
            const lidGroup = buildBoxHalf(width, length, height, wall, 1, 1, material);
            lidGroup.position.set(0, length/2 + gap/2, 0);
           
            const latchGroup = new THREE.Group();
            const armW = width / 4;
            const armT = wall;
           
            const armLow = new THREE.Mesh(new THREE.BoxGeometry(armW, armT, height), material);
            armLow.position.set(0, 0, height/2);
            latchGroup.add(armLow);
           
            const strutL = new THREE.Mesh(new THREE.BoxGeometry(wall, armT, wall*2), material);
            strutL.position.set(-armW/2 + wall/2, 0, height + wall);
            latchGroup.add(strutL);
            const strutR = new THREE.Mesh(new THREE.BoxGeometry(wall, armT, wall*2), material);
            strutR.position.set(armW/2 - wall/2, 0, height + wall);
            latchGroup.add(strutR);
           
            const cap = new THREE.Mesh(new THREE.BoxGeometry(armW, armT, wall), material);
            cap.position.set(0, 0, height + wall*2.5);
            latchGroup.add(cap);
           
            latchGroup.position.set(0, length/2 + armT/2, 0);
            lidGroup.add(latchGroup);

            boxGroup.add(lidGroup);

            // Three.js Hinge & Pin Visualizer
            const hingeRadius = wall;
            const num_k = (width < 80) ? 3 : 5;
            const k_span = width / num_k;
            const all_indices = (width < 80) ? [-1, 0, 1] : [-2, -1, 0, 1, 2];
           
            for(let i of all_indices) {
                const x_pos = i * k_span;
                const kGeo = new THREE.CylinderGeometry(hingeRadius, hingeRadius, k_span - 1.0, 16);
                const kMesh = new THREE.Mesh(kGeo, material);
                kMesh.rotation.z = Math.PI / 2;
                kMesh.position.set(x_pos, 0, height + hingeRadius);
                boxGroup.add(kMesh);
            }

            // Continuous Axis Pin Representation
            const pinGeo = new THREE.CylinderGeometry(1.0, 1.0, width - 1.0, 16);
            const pinMesh = new THREE.Mesh(pinGeo, pinMaterial);
            pinMesh.rotation.z = Math.PI / 2;
            pinMesh.position.set(0, 0, height + hingeRadius);
            boxGroup.add(pinMesh);

            // Text Preview
            if(customText) {
                const canvas = document.createElement('canvas');
                canvas.width = 1024;
                canvas.height = 1024;
                const ctx = canvas.getContext('2d');
               
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.font = `bold 120px "${font}"`;
                ctx.fillStyle = textColorHex;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
               
                ctx.fillText(customText, canvas.width/2, canvas.height/2);

                const tex = new THREE.CanvasTexture(canvas);
                tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
               
                const textGeo = new THREE.PlaneGeometry(width - wall*2, length - wall*2);
                const textMat = new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthWrite: false });
                const textMesh = new THREE.Mesh(textGeo, textMat);
               
                textMesh.position.set(0, length/2 + gap/2, -0.01);
                textMesh.rotation.x = Math.PI;
               
                boxGroup.add(textMesh);
            }

            boxGroup.rotation.x = -Math.PI / 2;
            scene.add(boxGroup);

            generateSCAD(width, length, height, wall, compX, compY, boxColorHex, textColorHex, customText, font, gap);
        }

        function generateSCAD(w, l, h, wall, cx, cy, boxHex, textHex, text, font, gap) {
            currentScadCode = `
// Print-in-Place Hinged Box with Snap-Fit Latch
// Parametric OpenSCAD Model

width = ${w};
length = ${l};
height = ${h};
wall = ${wall};
compX = ${cx};
compY = ${cy};
gap = ${gap};
$fn = 60;

box_color = "${boxHex}";
text_color = "${textHex}";
box_text = "${text}";
font_style = "${font}:style=Bold";

module main() {
    color(box_color) {
        translate([0, -length/2 - gap/2, 0]) base_box();
        translate([0, length/2 + gap/2, 0]) lid_box();
        build_base_hinges();
        build_lid_hinges();
    }
   
    if (box_text != "") {
        color(text_color)
        translate([0, length/2 + gap/2, -0.1])
        linear_extrude(0.7)
        mirror([1, 0, 0])
        text(box_text, font=font_style, size=min(width/5, length/(len(box_text)*0.8)), halign="center", valign="center");
    }
}

module base_box() {
    union() {
        difference() {
            translate([-width/2, -length/2, 0]) cube([width, length, height]);
           
            comp_w = (width - wall * (compX + 1)) / compX;
            comp_l = (length - wall * (compY + 1)) / compY;
           
            for(i=[0:compX-1]) {
                for(j=[0:compY-1]) {
                    translate([
                        -width/2 + wall + i*(comp_w+wall),
                        -length/2 + wall + j*(comp_l+wall),
                        wall
                    ])
                    cube([comp_w, comp_l, height]);
                }
            }
        }
       
        translate([-width/10, -length/2 - wall, height - wall*1.5])
        rotate([0, 90, 0])
        linear_extrude(width/5)
        polygon([[0,0], [wall*1.2, 0], [0, wall*1.2]]);
    }
}

module lid_box() {
    armW = width / 4;
    armT = wall;

    difference() {
        union() {
            translate([-width/2, -length/2, 0]) cube([width, length, height]);
           
            translate([0, length/2, 0]) {
                translate([-armW/2, 0, 0]) cube([armW, armT, height]);
                translate([-armW/2, 0, height]) cube([wall, armT, wall*2]);
                translate([armW/2 - wall, 0, height]) cube([wall, armT, wall*2]);
                translate([-armW/2, 0, height + wall*2]) cube([armW, armT, wall]);
            }
        }
       
        translate([-width/2 + wall, -length/2 + wall, wall])
        cube([width - wall*2, length - wall*2, height + 1]);
       
        if (box_text != "") {
            translate([0, 0, -0.2])
            linear_extrude(0.8)
            mirror([1, 0, 0])
            text(box_text, font=font_style, size=min(width/5, length/(len(box_text)*0.8)), halign="center", valign="center");
        }
    }
}

module build_base_hinges() {
    num_k = (width < 80) ? 3 : 5;
    k_span = width / num_k;
    hr = wall;               
    pin_r = 1.0;             
    pin_z = height + hr;     
    hinge_gap = 1.0;         
    k_tol = 1.0;             

    base_indices = (width < 80) ? [-1, 1] : [-2, 0, 2];

    union() {
        for(i = base_indices) {
            x_pos = i * k_span;
            
            translate([x_pos, 0, pin_z]) {
                difference() {
                    translate([-(k_span - k_tol)/2, -wall*1.5 - hinge_gap/2, -pin_z + height])
                    cube([k_span - k_tol, wall*1.5, pin_z - height]);

                    // Relief chamfer facing opposite side
                    translate([-k_span, hinge_gap/2, -pin_z + height - 0.5])
                    rotate([45, 0, 0])
                    cube([k_span*2, wall*2, wall*2]);

                    // FIRST LAYER ELEPHANT FOOT CHAMFER CUT (Bottom Z=0 Relief)
                    translate([-k_span, -wall*2, -pin_z + height - 0.3])
                    rotate([0, 45, 0])
                    cube([wall, wall*4, wall]);

                    translate([k_span - k_tol - 0.3, -wall*2, -pin_z + height - 0.3])
                    rotate([0, 45, 0])
                    cube([wall, wall*4, wall]);
                }

                rotate([0, 90, 0])
                cylinder(r=hr, h=k_span - k_tol, center=true);
            }
        }

        translate([0, 0, pin_z])
        rotate([0, 90, 0])
        cylinder(r=pin_r, h=width - k_tol, center=true);
    }
}

module build_lid_hinges() {
    module print_in_place_teardrop(r, h) {
        rotate([0, 90, 0])
        linear_extrude(h, center=true)
        polygon([
            [0, -r],         
            [r, 0],          
            [0.4*r, 1.05*r], 
            [0, 1.15*r],     
            [-0.4*r, 1.05*r],
            [-r, 0]          
        ]);
    }

    num_k = (width < 80) ? 3 : 5;
    k_span = width / num_k;
    hr = wall;               
    pin_r = 1.0;             
    bore_r = pin_r + 0.45;   
    pin_z = height + hr;     
    hinge_gap = 1.0;
    k_tol = 1.0;

    lid_indices = (width < 80) ? [0] : [-1, 1];

    for(i = lid_indices) {
        x_pos = i * k_span;

        translate([x_pos, 0, pin_z]) {
            difference() {
                union() {
                    difference() {
                        translate([-(k_span - k_tol)/2, 0, -pin_z + height])
                        cube([k_span - k_tol, wall*1.5 + hinge_gap/2, pin_z - height]);

                        translate([-k_span, -hinge_gap/2 - wall*2, -pin_z + height - 0.5])
                        rotate([45, 0, 0])
                        cube([k_span*2, wall*2, wall*2]);

                        // FIRST LAYER ELEPHANT FOOT CHAMFER CUT (Bottom Z=0 Relief)
                        translate([-k_span, -wall*2, -pin_z + height - 0.3])
                        rotate([0, 45, 0])
                        cube([wall, wall*4, wall]);

                        translate([k_span - k_tol - 0.3, -wall*2, -pin_z + height - 0.3])
                        rotate([0, 45, 0])
                        cube([wall, wall*4, wall]);
                    }

                    rotate([0, 90, 0])
                    cylinder(r=hr, h=k_span - k_tol, center=true);
                }

                print_in_place_teardrop(bore_r, k_span + 1);
            }
        }
    }
}

main();
`;
        }

        window.downloadSCAD = function() {
            const width = document.getElementById('width').value;
            const length = document.getElementById('length').value;
            const height = document.getElementById('height').value;
            const rawText = document.getElementById('customText').value;

            const safeText = rawText.replace(/[^a-zA-Z0-9\s_-]/g, '').trim() || "BOX";
            const tempId = "BOX-" + Math.random().toString(36).substring(2, 8).toUpperCase();
            
            const filename = `${safeText}_${width}x${length}x${height}_${tempId}.scad`;

            const blob = new Blob([currentScadCode], { type: "text/plain" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        };

        const inputs = document.querySelectorAll('input, select');
        inputs.forEach(input => input.addEventListener('input', updateModel));

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        });

        updateModel();
        animate();
    </script>
</body>
</html>
