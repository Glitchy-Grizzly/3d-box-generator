<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Order Lookup</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 40px; background: #1a1a2e; color: #fff; max-width: 650px; margin: auto; }
        h2 { color: #e94560; }
        .input-group { display: flex; gap: 10px; margin-bottom: 20px; }
        input { flex: 1; padding: 12px; font-size: 1rem; border-radius: 4px; border: 1px solid #0f3460; background: #16213e; color: white; }
        button { padding: 12px 20px; font-size: 1rem; background: #e94560; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:hover { background: #ff5c77; }
        #result { background: #16213e; padding: 20px; border-radius: 8px; margin-top: 20px; border: 1px solid #0f3460; display: none; }
        ul { list-style: none; padding: 0; line-height: 1.8; }
        li strong { color: #e94560; }
        pre { background: #1a1a2e; padding: 15px; border-radius: 5px; overflow-x: auto; color: #00ff00; font-family: monospace; font-size: 0.85rem; max-height: 250px; }
        .dl-btn { background: #0f3460; margin-top: 10px; }
        .dl-btn:hover { background: #1a4f8b; }
    </style>
</head>
<body>
    <h2>Customer Box Design Lookup</h2>
    <div class="input-group">
        <input type="text" id="designIdInput" placeholder="Enter Design ID (e.g. BOX-A8K2)">
        <button onclick="fetchDesign()">Search</button>
    </div>

    <div id="result">
        <h3>Design Specifications:</h3>
        <ul id="paramsList"></ul>
        
        <button class="dl-btn" onclick="downloadScad()">Download .SCAD File</button>
        
        <h3>OpenSCAD Source Code:</h3>
        <pre id="scadDisplay"></pre>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { initializeAppCheck, ReCaptchaEnterpriseProvider } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app-check.js";

        const firebaseConfig = {
          apiKey: "AIzaSyB1aOZeIwyhVEb4D2sRimetbjDJhbeZRqI",
          authDomain: "print-in-place-boxes.firebaseapp.com",
          projectId: "print-in-place-boxes",
          storageBucket: "print-in-place-boxes.firebasestorage.app",
          messagingSenderId: "282832338212",
          appId: "1:282832338212:web:817f6b6906ca93aafa87b1"
        };

        const app = initializeApp(firebaseConfig);

        // Initialize App Check with reCAPTCHA Enterprise
        const appCheck = initializeAppCheck(app, {
            provider: new ReCaptchaEnterpriseProvider('6LepIfgtAAAAAJORMQZiUfuHOvjNQ5f3Uz-Ax2pz'),
            isTokenAutoRefreshEnabled: true
        });

        const db = getFirestore(app);
        let currentScad = "";
        let currentDesignData = null;

        window.fetchDesign = async function() {
            const id = document.getElementById('designIdInput').value.trim().toUpperCase();
            if (!id) return alert("Please enter a Design ID");

            try {
                const docRef = doc(db, "custom_boxes", id);
                const docSnap = await getDoc(docRef);

                if (docSnap.exists()) {
                    currentDesignData = docSnap.data();
                    currentScad = currentDesignData.scadCode || "";
                    
                    document.getElementById('scadDisplay').innerText = currentScad;
                    document.getElementById('paramsList').innerHTML = `
                        <li><strong>Dimensions:</strong> ${currentDesignData.width}mm (W) x ${currentDesignData.length}mm (L) x ${currentDesignData.height}mm (H)</li>
                        <li><strong>Wall Thickness:</strong> ${currentDesignData.wall}mm</li>
                        <li><strong>Grid Dividers:</strong> ${currentDesignData.compX} (X) x ${currentDesignData.compY} (Y)</li>
                        <li><strong>Custom Text:</strong> "${currentDesignData.customText}" (${currentDesignData.font})</li>
                        <li><strong>Date Created:</strong> ${new Date(currentDesignData.createdAt).toLocaleString()}</li>
                    `;
                    document.getElementById('result').style.display = "block";
                } else {
                    alert("No design found with ID: " + id);
                    document.getElementById('result').style.display = "none";
                }
            } catch (error) {
                console.error("Error fetching document:", error);
                alert("Error fetching design. Make sure your Firestore Security Rules allow read access if testing from this page!");
            }
        };

        window.downloadScad = function() {
            const id = document.getElementById('designIdInput').value.trim().toUpperCase();
            if (!currentDesignData) return;
        
            const safeText = (currentDesignData.customText || "BOX")
                .replace(/[^a-zA-Z0-9\s_-]/g, '')
                .trim() || "CUSTOM_BOX";

            const filename = `${safeText}_${currentDesignData.width}x${currentDesignData.length}x${currentDesignData.height}_${id}.scad`;

            const blob = new Blob([currentScad], { type: "text/plain" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        };
    </script>
</body>
</html>
