<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Print-in-Place Multi-Shape Box Generator</title>
    <style>
        :root {
            --bg-color: #1a1a2e;
            --panel-bg: #16213e;
            --accent: #0f3460;
            --neon: #e94560;
            --text: #e0e0e0;
        }
        body {
            margin: 0;
            padding: 0;
            display: flex;
            height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            overflow: hidden;
        }
        #sidebar {
            width: 350px;
            background-color: var(--panel-bg);
            padding: 20px;
            box-shadow: 2px 0 10px rgba(0,0,0,0.5);
            overflow-y: auto;
            z-index: 10;
            box-sizing: border-box;
        }
        #viewer {
            flex-grow: 1;
            position: relative;
        }
        h1 {
            color: var(--neon);
            font-size: 1.5rem;
            text-align: center;
            margin-top: 0;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .control-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            font-size: 0.9rem;
            color: #aaa;
        }
        input[type="range"], input[type="text"], select {
            width: 100%;
            padding: 8px;
            background: var(--bg-color);
            border: 1px solid var(--accent);
            color: white;
            border-radius: 4px;
            box-sizing: border-box;
        }
        input[type="range"] {
            padding: 0;
        }
        .value-display {
            float: right;
            color: var(--neon);
            font-weight: bold;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: var(--neon);
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 10px;
        }
        button:hover {
            background-color: #ff5c77;
        }
        button.etsy-btn {
            background-color: #f1641e;
            margin-top: 15px;
        }
        button.etsy-btn:hover {
            background-color: #ff7d3b;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div id="sidebar">
        <h1>Box Generator</h1>

        <div class="control-group">
            <label for="shapeSelect">Box Shape</label>
            <select id="shapeSelect">
                <option value="rectangle" selected>Rectangle</option>
                <option value="heart">Heart</option>
                <option value="hexagon">Hexagon</option>
                <option value="circle">Circle / Round</option>
                <option value="octagon">Octagon</option>
            </select>
        </div>
       
        <div class="control-group">
            <label>Width / Size <span class="value-display" id="valWidth">120</span></label>
            <input type="range" id="width" min="40" max="200" value="120">
        </div>
        <div class="control-group" id="lengthGroup">
            <label>Length (Each Half) <span class="value-display" id="valLength">90</span></label>
            <input type="range" id="length" min="40" max="100" value="90">
        </div>
        <div class="control-group">
            <label>Height (Each Half) <span class="value-display" id="valHeight">20</span></label>
            <input type="range" id="height" min="10" max="50" value="20">
        </div>
        
        <!-- Wall thickness is fixed at 2.0mm for optimal print stability -->
        <input type="hidden" id="wall" value="2.0">

        <div class="control-group" id="compGroupX">
            <label>Compartments X <span class="value-display" id="valCompX">2</span></label>
            <input type="range" id="compX" min="1" max="5" value="2">
        </div>
        <div class="control-group" id="compGroupY">
            <label>Compartments Y <span class="value-display" id="valCompY">1</span></label>
            <input type="range" id="compY" min="1" max="5" value="1">
        </div>

        <div class="control-group">
            <label for="boxColorSelect">Box Color (Bambu PLA)</label>
            <select id="boxColorSelect">
                <option value="#C12E1F">Red</option>
                <option value="#000000">Black</option>
                <option value="#FFFFFF">White (Jade White)</option>
                <option value="#F4EE2A">Yellow</option>
                <option value="#0A2989">Blue</option>
                <option value="#3F8E43">Dark Green (Mistletoe)</option>
                <option value="#8E9089">Gray</option>
                <option value="#6F5034">Cocoa Brown</option>
                <option value="#E4BD68">Gold</option>
                <option value="#5E43B7">Purple</option>
                <option value="#F5547C" selected>Hot Pink</option>
            </select>
        </div>

        <div class="control-group">
            <label for="textColorSelect">Text Color (Bambu PLA)</label>
            <select id="textColorSelect">
                <option value="#000000" selected>Black</option>
                <option value="#FFFFFF">White (Jade White)</option>
                <option value="#F4EE2A">Yellow</option>
                <option value="#C12E1F">Red</option>
                <option value="#0A2989">Blue</option>
                <option value="#3F8E43">Dark Green (Mistletoe)</option>
                <option value="#8E9089">Gray</option>
                <option value="#6F5034">Cocoa Brown</option>
                <option value="#E4BD68">Gold</option>
                <option value="#5E43B7">Purple</option>
                <option value="#F5547C">Hot Pink</option>
            </select>
        </div>

        <div class="control-group">
            <label>Custom Text</label>
            <input type="text" id="customText" value="MY GAME" placeholder="Top Lid Text">
        </div>
        <div class="control-group">
            <label for="fontSelect">Font</label>
            <select id="fontSelect">
                <option value="Impact">Impact</option>
                <option value="Arial Black">Arial Black</option>
                <option value="Trebuchet MS">Trebuchet MS</option>
                <option value="Courier New">Courier New</option>
            </select>
        </div>

        <button onclick="downloadSCAD()">Download OpenSCAD File</button>
        <button class="etsy-btn" onclick="saveBoxAndRedirect()">Order Custom Box on Etsy</button>
    </div>

    <div id="viewer"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_ID.appspot.com",
            messagingSenderId: "123456789",
            appId: "1:123456789:web:abcdef"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.saveBoxAndRedirect = async function() {
            const boxParams = {
                shape: document.getElementById('shapeSelect').value,
                width: parseFloat(document.getElementById('width').value),
                length: parseFloat(document.getElementById('length').value),
                height: parseFloat(document.getElementById('height').value),
                wall: 2.0,
                compX: parseInt(document.getElementById('compX').value),
                compY: parseInt(document.getElementById('compY').value),
                boxColor: document.getElementById('boxColorSelect').value,
                textColor: document.getElementById('textColorSelect').value,
                customText: document.getElementById('customText').value,
                font: document.getElementById('fontSelect').value,
                scadCode: currentScadCode,
                createdAt: new Date().toISOString()
            };

            const designId = "BOX-" + Math.random().toString(36).substring(2, 8).toUpperCase();

            try {
                await setDoc(doc(db, "custom_boxes", designId), boxParams);
                await navigator.clipboard.writeText(designId);
                alert(`Design Code ${designId} copied to clipboard!\n\nPlease paste this code into the Personalization field on Etsy.`);
                window.location.href = "https://www.etsy.com/shop/YourShopName";
            } catch (error) {
                console.error("Error saving design to Firebase:", error);
                alert("Could not save design. Please make sure your Firebase keys are set correctly.");
            }
        };
    </script>

    <script>
        let currentScadCode = "";

        const container = document.getElementById('viewer');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a2e);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 150, 150);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(50, 100, 50);
        dirLight.castShadow = true;
        scene.add(dirLight);

        const gridHelper = new THREE.GridHelper(300, 30, 0x0f3460, 0x222222);
        scene.add(gridHelper);

        let boxGroup = new THREE.Group();
        scene.add(boxGroup);

        function updateModel() {
            const shapeType = document.getElementById('shapeSelect').value;
            const width = parseFloat(document.getElementById('width').value);
            const length = parseFloat(document.getElementById('length').value);
            const height = parseFloat(document.getElementById('height').value);
            const wall = 2.0;
            const compX = parseInt(document.getElementById('compX').value);
            const compY = parseInt(document.getElementById('compY').value);
            const boxColorHex = document.getElementById('boxColorSelect').value;
            const textColorHex = document.getElementById('textColorSelect').value;
            const customText = document.getElementById('customText').value;
            const font = document.getElementById('fontSelect').value;

            // UI Visibility based on Shape Selection
            if (shapeType === 'rectangle') {
                document.getElementById('lengthGroup').style.display = 'block';
                document.getElementById('compGroupX').style.display = 'block';
                document.getElementById('compGroupY').style.display = 'block';
            } else {
                document.getElementById('lengthGroup').style.display = 'none';
                document.getElementById('compGroupX').style.display = 'none';
                document.getElementById('compGroupY').style.display = 'none';
            }

            document.getElementById('valWidth').innerText = width;
            document.getElementById('valLength').innerText = length;
            document.getElementById('valHeight').innerText = height;
            document.getElementById('valCompX').innerText = compX;
            document.getElementById('valCompY').innerText = compY;

            scene.remove(boxGroup);
            boxGroup = new THREE.Group();

            const material = new THREE.MeshStandardMaterial({
                color: new THREE.Color(boxColorHex),
                roughness: 0.4,
                metalness: 0.1
            });

            const gap = 0.5;

            // Simple Box Preview Base
            const baseBoxGeo = new THREE.BoxGeometry(width, length, height);
            const baseMesh = new THREE.Mesh(baseBoxGeo, material);
            baseMesh.position.set(0, -length/2 - gap/2, height/2);
            boxGroup.add(baseMesh);

            const lidMesh = new THREE.Mesh(baseBoxGeo, material);
            lidMesh.position.set(0, length/2 + gap/2, height/2);
            boxGroup.add(lidMesh);

            boxGroup.rotation.x = -Math.PI / 2;
            scene.add(boxGroup);

            generateSCAD(shapeType, width, length, height, wall, compX, compY, boxColorHex, textColorHex, customText, font, gap);
        }

        function generateSCAD(shape, w, l, h, wall, cx, cy, boxHex, textHex, text, font, gap) {
            currentScadCode = `
// Print-in-Place Multi-Shape Box
// Auto-generated

shape = "${shape}";
width = ${w};
length = ${l};
height = ${h};
wall = ${wall};
compX = ${cx};
compY = ${cy};
gap = ${gap};
tol = 0.3;
$fn = 60;

box_color = "${boxHex}";
text_color = "${textHex}";
box_text = "${text}";
font_style = "${font}:style=Bold";

module main() {
    color(box_color) {
        translate([0, -length/2 - gap/2, 0]) base_box();
        translate([0, length/2 + gap/2, 0]) lid_box();
        build_hinges();
    }
   
    if (box_text != "") {
        color(text_color)
        translate([0, length/2 + gap/2, 0])
        rotate([0, 0, 180])
        linear_extrude(0.6)
        text(box_text, font=font_style, size=min(width/5, length/(len(box_text)*0.8)), halign="center", valign="center");
    }
}

module base_shape_2d(w, l) {
    if (shape == "heart") {
        scale([w/100, w/100, 1])
        polygon([
            [0, -40], [35, -10], [50, 20], [35, 45], [15, 45],
            [0, 25], [-15, 45], [-35, 45], [-50, 20], [-35, -10]
        ]);
    } else if (shape == "hexagon") {
        circle(r=w/2, $fn=6);
    } else if (shape == "circle") {
        circle(r=w/2, $fn=60);
    } else if (shape == "octagon") {
        circle(r=w/2, $fn=8);
    } else {
        square([w, l], center=true);
    }
}

module base_box() {
    union() {
        difference() {
            linear_extrude(height) base_shape_2d(width, length);
            translate([0, 0, wall]) linear_extrude(height) offset(r=-wall) base_shape_2d(width, length);
        }
        translate([-width/8, -length/2 - wall, height - wall*2])
        rotate([0, 90, 0])
        linear_extrude(width/4)
        polygon([[0,0], [wall*1.5, wall*1.5], [0, wall*1.5]]);
    }
}

module lid_box() {
    armW = width / 4;
    armT = wall;

    difference() {
        union() {
            linear_extrude(height) base_shape_2d(width, length);
            translate([0, length/2, 0]) {
                translate([-armW/2, 0, 0]) cube([armW, armT, height]);
                translate([-armW/2, 0, height]) cube([wall, armT, wall*2]);
                translate([armW/2 - wall, 0, height]) cube([wall, armT, wall*2]);
                translate([-armW/2, 0, height + wall*2]) cube([armW, armT, wall]);
            }
        }
        translate([0, 0, wall]) linear_extrude(height) offset(r=-wall) base_shape_2d(width, length);
        if (box_text != "") {
            translate([0, 0, -0.01]) rotate([0, 0, 180]) linear_extrude(0.61)
            text(box_text, font=font_style, size=min(width/5, length/(len(box_text)*0.8)), halign="center", valign="center");
        }
    }
}

module build_hinges() {
    module teardrop(r, l) {
        rotate([0, 90, 0])
        linear_extrude(l, center=true)
        polygon([[0, -r], [r, 0], [0, r], [-r*0.7, r*0.7], [-r, 0], [-r*0.7, -r*0.7]]);
    }

    knuckle_w = width / 5;
    hr = wall;
    pin_y = 0;
    pin_z = height;

    for(i = [-2, 0, 2]) {
        translate([i * knuckle_w, pin_y, pin_z]) {
            teardrop(hr - tol, knuckle_w - tol);
            translate([0, -gap/2 - wall/2, -hr/2])
            cube([knuckle_w - tol, wall + gap, hr], center=true);
        }
    }

    for(i = [-1, 1]) {
        translate([i * knuckle_w, pin_y, pin_z]) {
            difference() {
                union() {
                    rotate([0, 90, 0]) cylinder(r=hr, h=knuckle_w - tol, center=true);
                    translate([0, gap/2 + wall/2, -hr/2])
                    cube([knuckle_w - tol, wall + gap, hr], center=true);
                }
                teardrop(hr + tol/2, knuckle_w + 1);
            }
        }
    }
}

main();
`;
        }

        function downloadSCAD() {
            const width = document.getElementById('width').value;
            const length = document.getElementById('length').value;
            const height = document.getElementById('height').value;
            const rawText = document.getElementById('customText').value;

            const safeText = rawText.replace(/[^a-zA-Z0-9\s_-]/g, '').trim() || "BOX";
            const tempId = "BOX-" + Math.random().toString(36).substring(2, 8).toUpperCase();
            
            const filename = `${safeText}_${width}x${length}x${height}_${tempId}.scad`;

            const blob = new Blob([currentScadCode], { type: "text/plain" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        const inputs = document.querySelectorAll('input, select');
        inputs.forEach(input => input.addEventListener('input', updateModel));

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        });

        updateModel();
        animate();
    </script>
</body>
</html>
