<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Print-in-Place Multi-Shape Box Generator</title>
    <style>
        :root {
            --bg-color: #1a1a2e;
            --panel-bg: #16213e;
            --accent: #0f3460;
            --neon: #e94560;
            --text: #e0e0e0;
        }
        body {
            margin: 0;
            padding: 0;
            display: flex;
            height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            overflow: hidden;
        }
        #sidebar {
            width: 350px;
            background-color: var(--panel-bg);
            padding: 20px;
            box-shadow: 2px 0 10px rgba(0,0,0,0.5);
            overflow-y: auto;
            z-index: 10;
            box-sizing: border-box;
        }
        #viewer {
            flex-grow: 1;
            position: relative;
        }
        h1 {
            color: var(--neon);
            font-size: 1.5rem;
            text-align: center;
            margin-top: 0;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .control-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            font-size: 0.9rem;
            color: #aaa;
        }
        input[type="range"], input[type="text"], select {
            width: 100%;
            padding: 8px;
            background: var(--bg-color);
            border: 1px solid var(--accent);
            color: white;
            border-radius: 4px;
            box-sizing: border-box;
        }
        input[type="range"] {
            padding: 0;
        }
        .value-display {
            float: right;
            color: var(--neon);
            font-weight: bold;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: var(--neon);
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 10px;
        }
        button:hover {
            background-color: #ff5c77;
        }
        button.etsy-btn {
            background-color: #f1641e;
            margin-top: 15px;
        }
        button.etsy-btn:hover {
            background-color: #ff7d3b;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div id="sidebar">
        <h1>Box Generator</h1>

        <div class="control-group">
            <label for="shapeSelect">Box Shape</label>
            <select id="shapeSelect">
                <option value="rectangle" selected>Rectangle</option>
                <option value="heart">Heart</option>
                <option value="hexagon">Hexagon</option>
                <option value="circle">Circle / Round</option>
                <option value="octagon">Octagon</option>
            </select>
        </div>
       
        <div class="control-group">
            <label>Width / Size <span class="value-display" id="valWidth">120</span></label>
            <input type="range" id="width" min="50" max="200" value="120">
        </div>
        <div class="control-group" id="lengthGroup">
            <label>Length (Each Half) <span class="value-display" id="valLength">90</span></label>
            <input type="range" id="length" min="50" max="120" value="90">
        </div>
        <div class="control-group">
            <label>Height (Each Half) <span class="value-display" id="valHeight">20</span></label>
            <input type="range" id="height" min="10" max="50" value="20">
        </div>
        
        <input type="hidden" id="wall" value="2.0">

        <div class="control-group" id="compGroupX">
            <label>Compartments X <span class="value-display" id="valCompX">2</span></label>
            <input type="range" id="compX" min="1" max="5" value="2">
        </div>
        <div class="control-group" id="compGroupY">
            <label>Compartments Y <span class="value-display" id="valCompY">1</span></label>
            <input type="range" id="compY" min="1" max="5" value="1">
        </div>

        <div class="control-group">
            <label for="boxColorSelect">Box Color (Bambu PLA)</label>
            <select id="boxColorSelect">
                <option value="#C12E1F">Red</option>
                <option value="#000000">Black</option>
                <option value="#FFFFFF">White (Jade White)</option>
                <option value="#F4EE2A">Yellow</option>
                <option value="#0A2989">Blue</option>
                <option value="#3F8E43">Dark Green (Mistletoe)</option>
                <option value="#8E9089">Gray</option>
                <option value="#6F5034">Cocoa Brown</option>
                <option value="#E4BD68">Gold</option>
                <option value="#5E43B7">Purple</option>
                <option value="#F5547C" selected>Hot Pink</option>
            </select>
        </div>

        <div class="control-group">
            <label for="textColorSelect">Text Color (Bambu PLA)</label>
            <select id="textColorSelect">
                <option value="#000000" selected>Black</option>
                <option value="#FFFFFF">White (Jade White)</option>
                <option value="#F4EE2A">Yellow</option>
                <option value="#C12E1F">Red</option>
                <option value="#0A2989">Blue</option>
                <option value="#3F8E43">Dark Green (Mistletoe)</option>
                <option value="#8E9089">Gray</option>
                <option value="#6F5034">Cocoa Brown</option>
                <option value="#E4BD68">Gold</option>
                <option value="#5E43B7">Purple</option>
                <option value="#F5547C">Hot Pink</option>
            </select>
        </div>

        <div class="control-group">
            <label>Custom Text</label>
            <input type="text" id="customText" value="MY GAME" placeholder="Top Lid Text">
        </div>
        <div class="control-group">
            <label for="fontSelect">Font</label>
            <select id="fontSelect">
                <option value="Impact">Impact</option>
                <option value="Arial Black">Arial Black</option>
                <option value="Trebuchet MS">Trebuchet MS</option>
                <option value="Courier New">Courier New</option>
            </select>
        </div>

        <button onclick="downloadSCAD()">Download OpenSCAD File</button>
        <button class="etsy-btn" onclick="saveBoxAndRedirect()">Order Custom Box on Etsy</button>
    </div>

    <div id="viewer"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_ID.appspot.com",
            messagingSenderId: "123456789",
            appId: "1:123456789:web:abcdef"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.saveBoxAndRedirect = async function() {
            const boxParams = {
                shape: document.getElementById('shapeSelect').value,
                width: parseFloat(document.getElementById('width').value),
                length: parseFloat(document.getElementById('length').value),
                height: parseFloat(document.getElementById('height').value),
                wall: 2.0,
                compX: parseInt(document.getElementById('compX').value),
                compY: parseInt(document.getElementById('compY').value),
                boxColor: document.getElementById('boxColorSelect').value,
                textColor: document.getElementById('textColorSelect').value,
                customText: document.getElementById('customText').value,
                font: document.getElementById('fontSelect').value,
                scadCode: currentScadCode,
                createdAt: new Date().toISOString()
            };

            const designId = "BOX-" + Math.random().toString(36).substring(2, 8).toUpperCase();

            try {
                await setDoc(doc(db, "custom_boxes", designId), boxParams);
                await navigator.clipboard.writeText(designId);
                alert(`Design Code ${designId} copied to clipboard!\n\nPlease paste this code into the Personalization field on Etsy.`);
                window.location.href = "https://www.etsy.com/shop/YourShopName";
            } catch (error) {
                console.error("Error saving design to Firebase:", error);
                alert("Could not save design. Please make sure your Firebase keys are set correctly.");
            }
        };
    </script>

    <script>
        let currentScadCode = "";

        const container = document.getElementById('viewer');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a2e);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 150, 150);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(50, 100, 50);
        dirLight.castShadow = true;
        scene.add(dirLight);

        const gridHelper = new THREE.GridHelper(300, 30, 0x0f3460, 0x222222);
        scene.add(gridHelper);

        let boxGroup = new THREE.Group();
        scene.add(boxGroup);

        // Helper function to build 2D shape vectors for Three.js
        function create2DShape(shapeType, w, l) {
            const shape = new THREE.Shape();
            if (shapeType === 'heart') {
                const s = w / 100;
                shape.moveTo(0 * s, -40 * s);
                shape.bezierCurveTo(25 * s, -25 * s, 50 * s, 0 * s, 50 * s, 25 * s);
                shape.bezierCurveTo(50 * s, 45 * s, 25 * s, 50 * s, 0 * s, 25 * s);
                shape.bezierCurveTo(-25 * s, 50 * s, -50 * s, 45 * s, -50 * s, 25 * s);
                shape.bezierCurveTo(-50 * s, 0 * s, -25 * s, -25 * s, 0 * s, -40 * s);
            } else if (shapeType === 'hexagon') {
                const r = w / 2;
                for (let i = 0; i < 6; i++) {
                    const angle = (i * Math.PI) / 3;
                    const x = r * Math.cos(angle);
                    const y = r * Math.sin(angle);
                    if (i === 0) shape.moveTo(x, y);
                    else shape.lineTo(x, y);
                }
            } else if (shapeType === 'circle') {
                shape.absarc(0, 0, w / 2, 0, Math.PI * 2, false);
            } else if (shapeType === 'octagon') {
                const r = w / 2;
                for (let i = 0; i < 8; i++) {
                    const angle = (i * Math.PI) / 4 + Math.PI / 8;
                    const x = r * Math.cos(angle);
                    const y = r * Math.sin(angle);
                    if (i === 0) shape.moveTo(x, y);
                    else shape.lineTo(x, y);
                }
            } else {
                shape.moveTo(-w / 2, -l / 2);
                shape.lineTo(w / 2, -l / 2);
                shape.lineTo(w / 2, l / 2);
                shape.lineTo(-w / 2, l / 2);
            }
            shape.closePath();
            return shape;
        }

        function createHollowMesh(shapeType, w, l, h, t, mat) {
            const outerShape = create2DShape(shapeType, w, l);
            const innerShape = create2DShape(shapeType, w - t * 2, l - t * 2);
            outerShape.holes.push(innerShape);

            const group = new THREE.Group();

            // Extruded Walls
            const wallGeo = new THREE.ExtrudeGeometry(outerShape, { depth: h - t, bevelEnabled: false });
            const wallMesh = new THREE.Mesh(wallGeo, mat);
            wallMesh.position.z = t;
            group.add(wallMesh);

            // Floor Solid Base
            const floorShape = create2DShape(shapeType, w, l);
            const floorGeo = new THREE.ExtrudeGeometry(floorShape, { depth: t, bevelEnabled: false });
            const floorMesh = new THREE.Mesh(floorGeo, mat);
            group.add(floorMesh);

            return group;
        }

        function updateModel() {
            const shapeType = document.getElementById('shapeSelect').value;
            const width = parseFloat(document.getElementById('width').value);
            const length = (shapeType === 'rectangle') ? parseFloat(document.getElementById('length').value) : width;
            const height = parseFloat(document.getElementById('height').value);
            const wall = 2.0;
            const compX = parseInt(document.getElementById('compX').value);
            const compY = parseInt(document.getElementById('compY').value);
            const boxColorHex = document.getElementById('boxColorSelect').value;
            const textColorHex = document.getElementById('textColorSelect').value;
            const customText = document.getElementById('customText').value;
            const font = document.getElementById('fontSelect').value;

            if (shapeType === 'rectangle') {
                document.getElementById('lengthGroup').style.display = 'block';
            } else {
                document.getElementById('lengthGroup').style.display = 'none';
            }

            document.getElementById('valWidth').innerText = width;
            document.getElementById('valLength').innerText = length;
            document.getElementById('valHeight').innerText = height;
            document.getElementById('valCompX').innerText = compX;
            document.getElementById('valCompY').innerText = compY;

            scene.remove(boxGroup);
            boxGroup = new THREE.Group();

            const material = new THREE.MeshStandardMaterial({
                color: new THREE.Color(boxColorHex),
                roughness: 0.4,
                metalness: 0.1
            });
            const hingeMaterial = material;

            const gap = 0.5;

            // --- Base Box Half ---
            const baseHalf = createHollowMesh(shapeType, width, length, height, wall, material);
            baseHalf.position.set(0, -length / 2 - gap / 2, 0);

            // Base Catch Wedge
            const wedgeShape = new THREE.Shape();
            wedgeShape.moveTo(0, 0);
            wedgeShape.lineTo(wall * 1.5, wall * 1.5);
            wedgeShape.lineTo(0, wall * 1.5);
            wedgeShape.closePath();
            const wedgeGeo = new THREE.ExtrudeGeometry(wedgeShape, { depth: width / 4, bevelEnabled: false });
            const wedge = new THREE.Mesh(wedgeGeo, material);
            wedge.rotation.x = Math.PI / 2;
            wedge.rotation.y = Math.PI / 2;
            wedge.position.set(-width / 8, -length / 2 - wall / 2, height - wall * 2);
            baseHalf.add(wedge);

            // Compartment Dividers
            if (compX > 1) {
                const cw = (width - wall * (compX + 1)) / compX;
                for (let i = 1; i < compX; i++) {
                    const div = new THREE.Mesh(new THREE.BoxGeometry(wall, length - wall * 2, height - wall), material);
                    div.position.set(-width / 2 + wall + i * cw + (i - 0.5) * wall, 0, (height + wall) / 2);
                    baseHalf.add(div);
                }
            }
            if (compY > 1) {
                const cl = (length - wall * (compY + 1)) / compY;
                for (let i = 1; i < compY; i++) {
                    const div = new THREE.Mesh(new THREE.BoxGeometry(width - wall * 2, wall, height - wall), material);
                    div.position.set(0, -length / 2 + wall + i * cl + (i - 0.5) * wall, (height + wall) / 2);
                    baseHalf.add(div);
                }
            }
            boxGroup.add(baseHalf);

            // --- Lid Box Half ---
            const lidHalf = createHollowMesh(shapeType, width, length, height, wall, material);
            lidHalf.position.set(0, length / 2 + gap / 2, 0);

            // Cantilever Snap Latch Arm
            const latchGroup = new THREE.Group();
            const armW = width / 4;
            const armLow = new THREE.Mesh(new THREE.BoxGeometry(armW, wall, height), material);
            armLow.position.set(0, 0, height / 2);
            latchGroup.add(armLow);

            const strutL = new THREE.Mesh(new THREE.BoxGeometry(wall, wall, wall * 2), material);
            strutL.position.set(-armW / 2 + wall / 2, 0, height + wall);
            latchGroup.add(strutL);
            const strutR = new THREE.Mesh(new THREE.BoxGeometry(wall, wall, wall * 2), material);
            strutR.position.set(armW / 2 - wall / 2, 0, height + wall);
            latchGroup.add(strutR);

            const cap = new THREE.Mesh(new THREE.BoxGeometry(armW, wall, wall), material);
            cap.position.set(0, 0, height + wall * 2.5);
            latchGroup.add(cap);

            latchGroup.position.set(0, length / 2 + wall / 2, 0);
            lidHalf.add(latchGroup);

            boxGroup.add(lidHalf);

            // --- Segmented Print-in-Place Hinge Knuckles ---
            const hingeRadius = wall;
            const knuckle_w = width / 5;

            for (let i of [-2, -1, 0, 1, 2]) {
                const kGeo = new THREE.CylinderGeometry(hingeRadius, hingeRadius, knuckle_w - 0.5, 16);
                const kMesh = new THREE.Mesh(kGeo, hingeMaterial);
                kMesh.rotation.z = Math.PI / 2;
                kMesh.position.set(i * knuckle_w, 0, height);
                boxGroup.add(kMesh);

                const anchorGeo = new THREE.BoxGeometry(knuckle_w - 0.5, wall * 2 + gap, hingeRadius * 2);
                const anchorMesh = new THREE.Mesh(anchorGeo, material);
                let yOffset = (i % 2 === 0) ? -wall : wall;
                anchorMesh.position.set(i * knuckle_w, yOffset / 2, height - hingeRadius / 2);
                boxGroup.add(anchorMesh);
            }

            // --- Text Canvas Overlay on Lid Bottom Face ---
            if (customText) {
                const canvas = document.createElement('canvas');
                canvas.width = 1024;
                canvas.height = 1024;
                const ctx = canvas.getContext('2d');

                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.font = `bold 120px "${font}"`;
                ctx.fillStyle = textColorHex;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';

                ctx.fillText(customText, canvas.width / 2, canvas.height / 2);

                const tex = new THREE.CanvasTexture(canvas);
                tex.anisotropy = renderer.capabilities.getMaxAnisotropy();

                const textGeo = new THREE.PlaneGeometry(width - wall * 2, length - wall * 2);
                const textMat = new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthWrite: false });
                const textMesh = new THREE.Mesh(textGeo, textMat);

                textMesh.position.set(0, length / 2 + gap / 2, -0.05);
                textMesh.rotation.x = Math.PI;
                boxGroup.add(textMesh);
            }

            boxGroup.rotation.x = -Math.PI / 2;
            scene.add(boxGroup);

            generateSCAD(shapeType, width, length, height, wall, compX, compY, boxColorHex, textColorHex, customText, font, gap);
        }

        function generateSCAD(shape, w, l, h, wall, cx, cy, boxHex, textHex, text, font, gap) {
            currentScadCode = `
// Print-in-Place Multi-Shape Box
// Auto-generated

shape = "${shape}";
width = ${w};
length = ${l};
height = ${h};
wall = ${wall};
compX = ${cx};
compY = ${cy};
gap = ${gap};
tol = 0.3;
$fn = 60;

box_color = "${boxHex}";
text_color = "${textHex}";
box_text = "${text}";
font_style = "${font}:style=Bold";

module main() {
    color(box_color) {
        translate([0, -length/2 - gap/2, 0]) base_box();
        translate([0, length/2 + gap/2, 0]) lid_box();
        build_hinges();
    }
   
    if (box_text != "") {
        color(text_color)
        translate([0, length/2 + gap/2, 0])
        rotate([0, 0, 180])
        linear_extrude(0.6)
        text(box_text, font=font_style, size=min(width/5, length/(len(box_text)*0.8)), halign="center", valign="center");
    }
}

module base_shape_2d(w, l) {
    if (shape == "heart") {
        scale([w/100, w/100, 1])
        polygon([
            [0, -40], [35, -10], [50, 20], [35, 45], [15, 45],
            [0, 25], [-15, 45], [-35, 45], [-50, 20], [-35, -10]
        ]);
    } else if (shape == "hexagon") {
        circle(r=w/2, $fn=6);
    } else if (shape == "circle") {
        circle(r=w/2, $fn=60);
    } else if
