<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Print-in-Place Hinged Box Studio</title>
    <link rel="icon" type="image/png" href="bear head 1024x1024.png">
    <style>
        :root {
            --bg-dark: #0f172a;
            --panel-bg: rgba(30, 41, 59, 0.92);
            --card-bg: rgba(15, 23, 42, 0.65);
            --border-color: rgba(148, 163, 184, 0.18);
            --neon: #f43f5e;
            --neon-hover: #fb7185;
            --etsy: #f1641e;
            --etsy-hover: #ff7d3b;
            --accent: #38bdf8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            height: 100vh;
            font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            overflow: hidden;
        }

        /* Sidebar Styling */
        #sidebar {
            width: 390px;
            background: var(--panel-bg);
            backdrop-filter: blur(16px);
            border-right: 1px solid var(--border-color);
            padding: 22px 20px;
            box-shadow: 10px 0 30px rgba(0, 0, 0, 0.5);
            overflow-y: auto;
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        #sidebar::-webkit-scrollbar {
            width: 6px;
        }
        #sidebar::-webkit-scrollbar-thumb {
            background: rgba(148, 163, 184, 0.3);
            border-radius: 3px;
        }

        .brand-header {
            text-align: center;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border-color);
        }

        .brand-header h1 {
            color: var(--text-main);
            font-size: 1.35rem;
            font-weight: 800;
            margin: 0;
            letter-spacing: 1px;
            text-transform: uppercase;
            background: linear-gradient(90deg, #fff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .brand-header p {
            margin: 4px 0 0;
            font-size: 0.78rem;
            color: var(--text-muted);
        }

        .section-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 14px;
        }

        .section-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: var(--accent);
            font-weight: 700;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .control-group {
            margin-bottom: 12px;
        }
        .control-group:last-child {
            margin-bottom: 0;
        }

        label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 0.85rem;
            color: #cbd5e1;
        }

        .value-badge {
            background: rgba(244, 63, 94, 0.15);
            color: #fda4af;
            border: 1px solid rgba(244, 63, 94, 0.3);
            padding: 2px 8px;
            border-radius: 999px;
            font-size: 0.78rem;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
        }

        /* Custom Range Sliders */
        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 6px;
            background: #334155;
            border-radius: 3px;
            outline: none;
            cursor: pointer;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--neon);
            border: 2px solid #fff;
            box-shadow: 0 0 8px rgba(244, 63, 94, 0.6);
            transition: transform 0.15s ease;
        }
        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.15);
        }

        input[type="text"], select {
            width: 100%;
            padding: 9px 11px;
            background: #0f172a;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            border-radius: 6px;
            font-size: 0.88rem;
            outline: none;
            transition: border-color 0.2s;
        }
        input[type="text"]:focus, select:focus {
            border-color: var(--accent);
        }

        .color-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .color-swatch {
            width: 28px;
            height: 28px;
            border-radius: 6px;
            border: 2px solid rgba(255, 255, 255, 0.25);
            flex-shrink: 0;
            box-shadow: inset 0 0 4px rgba(0,0,0,0.4);
        }

        /* Tier Pricing Card */
        .tier-card {
            background: linear-gradient(135deg, rgba(244, 63, 94, 0.14), rgba(56, 189, 248, 0.1));
            border: 1px solid rgba(244, 63, 94, 0.35);
            border-radius: 10px;
            padding: 12px 14px;
            text-align: center;
        }
        .tier-label {
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin-bottom: 4px;
        }
        #recommendedTier {
            font-size: 1.05rem;
            font-weight: 800;
            color: #fff;
        }
        #closedDims {
            font-size: 0.76rem;
            color: var(--accent);
            margin-top: 3px;
        }

        /* Buttons */
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        button {
            width: 100%;
            padding: 12px 16px;
            border: none;
            border-radius: 8px;
            font-size: 0.92rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .scad-btn {
            background-color: #334155;
            color: #f8fafc;
            border: 1px solid var(--border-color);
        }
        .scad-btn:hover {
            background-color: #475569;
        }

        .etsy-btn {
            background: linear-gradient(135deg, var(--etsy), #d9460f);
            color: white;
            box-shadow: 0 4px 15px rgba(241, 100, 30, 0.35);
        }
        .etsy-btn:hover {
            background: linear-gradient(135deg, var(--etsy-hover), var(--etsy));
            transform: translateY(-1px);
        }

        /* Viewer & Floating HUD */
        #viewer {
            flex-grow: 1;
            position: relative;
            background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
        }

        #hud-overlay {
            position: absolute;
            top: 18px;
            right: 18px;
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 12px 16px;
            width: 240px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.4);
            z-index: 5;
        }

        .hud-hint {
            position: absolute;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.75);
            border: 1px solid var(--border-color);
            padding: 6px 14px;
            border-radius: 999px;
            font-size: 0.75rem;
            color: var(--text-muted);
            pointer-events: none;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div id="sidebar">
        <div class="brand-header">
            <h1>Box Studio 3D</h1>
            <p>Print-in-Place Parametric Organizer</p>
        </div>

        <!-- Dimensions Section -->
        <div class="section-card">
            <div class="section-title">Dimensions (mm)</div>
            <div class="control-group">
                <label>Width (Hinge Axis) <span class="value-badge" id="valWidth">120 mm</span></label>
                <input type="range" id="width" min="40" max="200" value="120">
            </div>
            <div class="control-group">
                <label>Length (Each Half) <span class="value-badge" id="valLength">90 mm</span></label>
                <input type="range" id="length" min="40" max="150" value="90">
            </div>
            <div class="control-group">
                <label>Height (Each Half) <span class="value-badge" id="valHeight">20 mm</span></label>
                <input type="range" id="height" min="12" max="60" value="20">
            </div>
            <input type="hidden" id="wall" value="2.0">
        </div>

        <!-- Compartments Section -->
        <div class="section-card">
            <div class="section-title">Interior Grid (Base)</div>
            <div class="control-group">
                <label>Columns (X) <span class="value-badge" id="valCompX">2</span></label>
                <input type="range" id="compX" min="1" max="5" value="2">
            </div>
            <div class="control-group">
                <label>Rows (Y) <span class="value-badge" id="valCompY">1</span></label>
                <input type="range" id="compY" min="1" max="5" value="1">
            </div>
        </div>

        <!-- Colors & Personalization -->
        <div class="section-card">
            <div class="section-title">Colors & Lid Inlay</div>

            <div class="control-group">
                <label for="boxColorSelect">Box Color (Bambu PLA)</label>
                <div class="color-row">
                    <div id="boxSwatch" class="color-swatch" style="background: #F5547C;"></div>
                    <select id="boxColorSelect">
                        <option value="#C12E1F">Red</option>
                        <option value="#1A1A1A">Black</option>
                        <option value="#F8FAFC">White (Jade White)</option>
                        <option value="#F4EE2A">Yellow</option>
                        <option value="#0A2989">Blue</option>
                        <option value="#3F8E43">Dark Green (Mistletoe)</option>
                        <option value="#8E9089">Gray</option>
                        <option value="#6F5034">Cocoa Brown</option>
                        <option value="#E4BD68">Gold</option>
                        <option value="#5E43B7">Purple</option>
                        <option value="#F5547C" selected>Hot Pink</option>
                    </select>
                </div>
            </div>

            <div class="control-group">
                <label for="textColorSelect">Text Inlay Color (Bambu PLA)</label>
                <div class="color-row">
                    <div id="textSwatch" class="color-swatch" style="background: #1A1A1A;"></div>
                    <select id="textColorSelect">
                        <option value="#1A1A1A" selected>Black</option>
                        <option value="#F8FAFC">White (Jade White)</option>
                        <option value="#F4EE2A">Yellow</option>
                        <option value="#C12E1F">Red</option>
                        <option value="#0A2989">Blue</option>
                        <option value="#3F8E43">Dark Green (Mistletoe)</option>
                        <option value="#8E9089">Gray</option>
                        <option value="#6F5034">Cocoa Brown</option>
                        <option value="#E4BD68">Gold</option>
                        <option value="#5E43B7">Purple</option>
                        <option value="#F5547C">Hot Pink</option>
                    </select>
                </div>
            </div>

            <div class="control-group">
                <label>Custom Lid Text</label>
                <input type="text" id="customText" value="MY GAME" placeholder="Top Lid Text">
            </div>

            <div class="control-group">
                <label for="fontSelect">Font Style</label>
                <select id="fontSelect">
                    <option value="Impact">Impact</option>
                    <option value="Arial Black">Arial Black</option>
                    <option value="Trebuchet MS">Trebuchet MS</option>
                    <option value="Courier New">Courier New</option>
                </select>
            </div>
        </div>

        <!-- Etsy Tier Summary -->
        <div class="tier-card">
            <div class="tier-label">Recommended Etsy Tier</div>
            <div id="recommendedTier">Small Box (0 cm³)</div>
            <div id="closedDims">Closed Box: 120 × 90 × 40 mm</div>
        </div>

        <div class="btn-group">
            <button class="etsy-btn" onclick="saveBoxAndRedirect()">Order Custom Box on Etsy</button>
            <button class="scad-btn" onclick="downloadSCAD()">Download OpenSCAD (.scad)</button>
        </div>
    </div>

    <div id="viewer">
        <!-- Floating 3D Fold Preview Control -->
        <div id="hud-overlay">
            <div class="section-title" style="margin-bottom: 8px;">Interactive Hinge Test</div>
            <label style="font-size: 0.8rem;">
                Fold Lid <span class="value-badge" id="valFold">0° (Flat)</span>
            </label>
            <input type="range" id="foldAngle" min="0" max="180" value="0">
        </div>
        <div class="hud-hint">Left-Click + Drag to Orbit • Scroll to Zoom • Right-Click to Pan</div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_ID.appspot.com",
            messagingSenderId: "123456789",
            appId: "1:123456789:web:abcdef"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.saveBoxAndRedirect = async function() {
            const boxParams = {
                shape: "rectangle",
                width: parseFloat(document.getElementById('width').value),
                length: parseFloat(document.getElementById('length').value),
                height: parseFloat(document.getElementById('height').value),
                wall: 2.0,
                compX: parseInt(document.getElementById('compX').value),
                compY: parseInt(document.getElementById('compY').value),
                boxColor: document.getElementById('boxColorSelect').value,
                textColor: document.getElementById('textColorSelect').value,
                customText: document.getElementById('customText').value,
                font: document.getElementById('fontSelect').value,
                scadCode: currentScadCode,
                createdAt: new Date().toISOString()
            };

            const designId = "BOX-" + Math.random().toString(36).substring(2, 8).toUpperCase();

            try {
                await setDoc(doc(db, "custom_boxes", designId), boxParams);
                await navigator.clipboard.writeText(designId);
                alert(`Design Code ${designId} copied to clipboard!\n\nPlease paste this code into the Personalization field on Etsy.`);
                window.location.href = "https://www.etsy.com/shop/YourShopName";
            } catch (error) {
                console.error("Error saving design to Firebase:", error);
                alert("Could not save design. Please make sure your Firebase keys are set correctly.");
            }
        };
    </script>

    <script>
        let currentScadCode = "";

        const container = document.getElementById('viewer');
        const scene = new THREE.Scene();

        const camera = new THREE.PerspectiveCamera(42, container.clientWidth / container.clientHeight, 0.1, 1500);
        camera.position.set(130, 145, 165);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.06;

        // Studio 3-Point Lighting
        const hemiLight = new THREE.HemisphereLight(0xffffff, 0x1e293b, 0.65);
        scene.add(hemiLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.85);
        dirLight.position.set(80, 160, 90);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        scene.add(dirLight);

        const rimLight = new THREE.DirectionalLight(0x38bdf8, 0.3);
        rimLight.position.set(-100, 60, -100);
        scene.add(rimLight);

        // Print Bed Grid
        const gridHelper = new THREE.GridHelper(256, 16, 0x38bdf8, 0x334155);
        gridHelper.position.y = -0.1;
        scene.add(gridHelper);

        let boxGroup = new THREE.Group();
        scene.add(boxGroup);

        function buildBoxHalf(w, l, h, t, cx, cy, mat) {
            const group = new THREE.Group();

            const floor = new THREE.Mesh(new THREE.BoxGeometry(w, l, t), mat);
            floor.position.set(0, 0, t / 2);
            floor.castShadow = true;
            floor.receiveShadow = true;
            group.add(floor);

            const left = new THREE.Mesh(new THREE.BoxGeometry(t, l, h), mat);
            left.position.set(-w / 2 + t / 2, 0, h / 2);
            left.castShadow = true;
            group.add(left);

            const right = new THREE.Mesh(new THREE.BoxGeometry(t, l, h), mat);
            right.position.set(w / 2 - t / 2, 0, h / 2);
            right.castShadow = true;
            group.add(right);

            const front = new THREE.Mesh(new THREE.BoxGeometry(w - t * 2, t, h), mat);
            front.position.set(0, -l / 2 + t / 2, h / 2);
            front.castShadow = true;
            group.add(front);

            const back = new THREE.Mesh(new THREE.BoxGeometry(w - t * 2, t, h), mat);
            back.position.set(0, l / 2 - t / 2, h / 2);
            back.castShadow = true;
            group.add(back);

            if (cx > 1) {
                const cw = (w - t * (cx + 1)) / cx;
                for (let i = 1; i < cx; i++) {
                    const div = new THREE.Mesh(new THREE.BoxGeometry(t, l - t * 2, h - t), mat);
                    div.position.set(-w / 2 + t + i * cw + (i - 0.5) * t, 0, t + (h - t) / 2);
                    div.castShadow = true;
                    group.add(div);
                }
            }
            if (cy > 1) {
                const cl = (l - t * (cy + 1)) / cy;
                for (let i = 1; i < cy; i++) {
                    const div = new THREE.Mesh(new THREE.BoxGeometry(w - t * 2, t, h - t), mat);
                    div.position.set(0, -l / 2 + t + i * cl + (i - 0.5) * t, t + (h - t) / 2);
                    div.castShadow = true;
                    group.add(div);
                }
            }

            return group;
        }

        function createWedgeMesh(w, l, h, wall, mat) {
            const armW = Math.max(16.0, w / 4.0);
            const latch_hole = armW - 2 * wall;
            const w_span = latch_hole - 4.0;

            const x_min = -w_span / 2;
            const x_max =  w_span / 2;
            const y_wall = -l / 2;
            const y_tip  = -l / 2 - 1.0;
            const z_top  = h;
            const z_bot  = h - 3.0;

            const vertices = new Float32Array([
                x_min, y_wall, z_top,
                x_max, y_wall, z_top,
                x_min, y_wall, z_bot,
                x_max, y_wall, z_bot,
                x_min, y_tip,  z_bot,
                x_max, y_tip,  z_bot,
            ]);

            const indices = [
                0, 2, 1,   1, 2, 3,
                2, 4, 3,   3, 4, 5,
                0, 1, 4,   1, 5, 4,
                0, 4, 2,
                1, 3, 5
            ];

            const geo = new THREE.BufferGeometry();
            geo.setAttribute('position', new THREE.BufferAttribute(vertices, 3));
            geo.setIndex(indices);
            geo.computeVertexNormals();

            return new THREE.Mesh(geo, mat);
        }

        function updateModel() {
            const width = parseFloat(document.getElementById('width').value);
            const length = parseFloat(document.getElementById('length').value);
            const height = parseFloat(document.getElementById('height').value);
            const wall = 2.0;
            const compX = parseInt(document.getElementById('compX').value);
            const compY = parseInt(document.getElementById('compY').value);
            const boxColorHex = document.getElementById('boxColorSelect').value;
            const textColorHex = document.getElementById('textColorSelect').value;
            const customText = document.getElementById('customText').value;
            const font = document.getElementById('fontSelect').value;
            const foldDeg = parseFloat(document.getElementById('foldAngle').value);

            // Update Badges & Color Swatches
            document.getElementById('valWidth').innerText = `${width} mm`;
            document.getElementById('valLength').innerText = `${length} mm`;
            document.getElementById('valHeight').innerText = `${height} mm`;
            document.getElementById('valCompX').innerText = compX;
            document.getElementById('valCompY').innerText = compY;
            document.getElementById('valFold').innerText = foldDeg === 0 ? "0° (Flat)" : (foldDeg === 180 ? "180° (Closed)" : `${foldDeg}°`);
            document.getElementById('boxSwatch').style.background = boxColorHex;
            document.getElementById('textSwatch').style.background = textColorHex;

            const totalVolumeCm3 = (width * length * (height * 2)) / 1000;
            let tier = "Small Box";
            if (totalVolumeCm3 > 900) tier = "Extra Large Box";
            else if (totalVolumeCm3 > 450) tier = "Large Box";
            else if (totalVolumeCm3 > 150) tier = "Medium Box";
            if (compX > 2 || compY > 2) tier += " (+ Divider Add-on)";

            document.getElementById('recommendedTier').innerText = `${tier} (${Math.round(totalVolumeCm3)} cm³)`;
            document.getElementById('closedDims').innerText = `Closed Footprint: ${width} × ${length} × ${height * 2} mm`;

            scene.remove(boxGroup);
            boxGroup = new THREE.Group();

            const material = new THREE.MeshStandardMaterial({
                color: new THREE.Color(boxColorHex),
                roughness: 0.38,
                metalness: 0.08
            });
            const pinMaterial = new THREE.MeshStandardMaterial({
                color: 0x94a3b8,
                roughness: 0.25,
                metalness: 0.5
            });

            const gap = 1.2;
            const hr = 3.2; // Upgraded 3.2mm Hinge Knuckle Radius
            const num_k = (width < 80) ? 3 : 5;
            const k_span = width / num_k;
            const k_tol = 0.40;
            const base_indices = (width < 80) ? [-1, 1] : [-2, 0, 2];
            const lid_indices  = (width < 80) ? [0] : [-1, 1];

            // 1. BASE BOX HALF
            const baseGroup = buildBoxHalf(width, length, height, wall, compX, compY, material);
            baseGroup.position.set(0, -length / 2 - gap / 2, 0);
            baseGroup.add(createWedgeMesh(width, length, height, wall, material));
            boxGroup.add(baseGroup);

            // Base Hinge Knuckles & Pin
            for (let i of base_indices) {
                const x_pos = i * k_span;
                const kGeo = new THREE.CylinderGeometry(hr, hr, k_span - k_tol, 24);
                const kMesh = new THREE.Mesh(kGeo, material);
                kMesh.rotation.z = Math.PI / 2;
                kMesh.position.set(x_pos, 0, height);
                boxGroup.add(kMesh);
            }
            const pinGeo = new THREE.CylinderGeometry(1.35, 1.35, width - k_tol, 20);
            const pinMesh = new THREE.Mesh(pinGeo, pinMaterial);
            pinMesh.rotation.z = Math.PI / 2;
            pinMesh.position.set(0, 0, height);
            boxGroup.add(pinMesh);

            // 2. LID PIVOT GROUP (Rotates around Hinge Axis [0, 0, height])
            const lidPivot = new THREE.Group();
            lidPivot.position.set(0, 0, height);
            lidPivot.rotation.x = -THREE.MathUtils.degToRad(foldDeg);

            const lidGroup = buildBoxHalf(width, length, height, wall, 1, 1, material);
            lidGroup.position.set(0, length / 2 + gap / 2, -height);

            // Spring Latch on Lid
            const latchGroup = new THREE.Group();
            const armW = Math.max(16.0, width / 4.0);
            const armT = 1.8;
            const armH = 5.8;

            const strutL = new THREE.Mesh(new THREE.BoxGeometry(wall, armT, armH + 3.0), material);
            strutL.position.set(-armW / 2 + wall / 2, 0, height + armH / 2 - 1.5);
            latchGroup.add(strutL);

            const strutR = new THREE.Mesh(new THREE.BoxGeometry(wall, armT, armH + 3.0), material);
            strutR.position.set(armW / 2 - wall / 2, 0, height + armH / 2 - 1.5);
            latchGroup.add(strutR);

            const cap = new THREE.Mesh(new THREE.BoxGeometry(armW, armT, 2.0), material);
            cap.position.set(0, 0, height + armH - 1.0);
            latchGroup.add(cap);

            const tab = new THREE.Mesh(new THREE.BoxGeometry(armW * 0.7, 2.5, 1.8), material);
            tab.position.set(0, 1.2, height + armH - 0.9);
            latchGroup.add(tab);

            latchGroup.position.set(0, length / 2 + armT / 2, 0);
            lidGroup.add(latchGroup);
            lidPivot.add(lidGroup);

            // Lid Hinge Knuckles (rotates with Lid)
            for (let i of lid_indices) {
                const x_pos = i * k_span;
                const kGeo = new THREE.CylinderGeometry(hr, hr, k_span - k_tol, 24);
                const kMesh = new THREE.Mesh(kGeo, material);
                kMesh.rotation.z = Math.PI / 2;
                kMesh.position.set(x_pos, 0, 0);
                lidPivot.add(kMesh);
            }

            // Custom Text Inlay Preview on Lid Exterior
            if (customText) {
                const canvas = document.createElement('canvas');
                canvas.width = 1024;
                canvas.height = 1024;
                const ctx = canvas.getContext('2d');

                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.font = `bold 130px "${font}"`;
                ctx.fillStyle = textColorHex;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(customText, canvas.width / 2, canvas.height / 2);

                const tex = new THREE.CanvasTexture(canvas);
                tex.anisotropy = renderer.capabilities.getMaxAnisotropy();

                const textGeo = new THREE.PlaneGeometry(width - wall * 2, length - wall * 2);
                const textMat = new THREE.MeshBasicMaterial({ map: tex, transparent: true, side: THREE.DoubleSide });
                const textMesh = new THREE.Mesh(textGeo, textMat);

                textMesh.position.set(0, length / 2 + gap / 2, -height - 0.05);
                textMesh.rotation.x = Math.PI;
                lidPivot.add(textMesh);
            }

            boxGroup.add(lidPivot);

            // Orient Z-up CAD coords to Three.js Y-up world
            boxGroup.rotation.x = -Math.PI / 2;
            scene.add(boxGroup);

            generateSCAD(width, length, height, wall, compX, compY, boxColorHex, textColorHex, customText, font, gap);
        }

        function generateSCAD(w, l, h, wall, cx, cy, boxHex, textHex, text, font, gap) {
            currentScadCode = `// Print-in-Place Hinged Box with Snap-Fit Latch (Bambu P1S Tuned)
// Parametric OpenSCAD Model

width = ${w};
length = ${l};
height = ${h};
wall = ${wall};
compX = ${cx};
compY = ${cy};
gap = ${gap};  // 1.2mm printing gap for flush closed alignment
$fn = 64;

box_color = "${boxHex}";
text_color = "${textHex}";
box_text = "${text}";
font_style = "${font}:style=Bold";

// --- DIALED-IN PRINT-IN-PLACE HINGE PARAMETERS (0.4mm Nozzle / Arachne) ---
num_k   = (width < 80) ? 3 : 5;
k_span  = width / num_k;
hr      = 3.20;  // 3.20mm outer knuckle radius (gives thick 1.50mm walls around bore)
pin_r   = 1.35;  // 2.70mm diameter solid pin (prevents sag & snapping across wide spans)
bore_r  = 1.70;  // 3.40mm bore (0.35mm radial clearance all around pin)
k_tol   = 0.40;  // 0.40mm axial clearance between knuckles
gusset_h = 5.0;  // Smooth 45-deg support transition into the 2.0mm box wall

module main() {
    color(box_color) {
        translate([0, -length/2 - gap/2, 0]) base_box();
        translate([0, length/2 + gap/2, 0]) lid_box();
        build_base_hinges();
        build_lid_hinges();
    }
    
    if (box_text != "") {
        color(text_color)
        translate([0, length/2 + gap/2, 0])
        linear_extrude(0.6)
        mirror([1, 0, 0])
        text(box_text, font=font_style, size=min(width/5, length/(len(box_text)*0.8)), halign="center", valign="center");
    }
}

module base_box() {
    union() {
        difference() {
            translate([-width/2, -length/2, 0]) cube([width, length, height]);
            
            comp_w = (width - wall * (compX + 1)) / compX;
            comp_l = (length - wall * (compY + 1)) / compY;
            
            for(i=[0:compX-1]) {
                for(j=[0:compY-1]) {
                    translate([
                        -width/2 + wall + i*(comp_w+wall),
                        -length/2 + wall + j*(comp_l+wall),
                        wall
                    ])
                    cube([comp_w, comp_l, height]);
                }
            }

            // Relief pockets so lid knuckles rotate freely without hitting base wall
            lid_indices = (width < 80) ? [0] : [-1, 1];
            for(i = lid_indices) {
                x_pos = i * k_span;
                translate([x_pos, length/2 + gap/2, height])
                rotate([0, 90, 0])
                cylinder(r=hr + 0.5, h=k_span + k_tol, center=true);
            }
        }
        
        armW = max(16.0, width / 4.0);
        latch_hole = armW - 2 * wall;
        w_span = latch_hole - 4.0; 

        // Catch wedge with smooth 1.0mm protrusion
        polyhedron(
            points = [
                [-w_span/2, -length/2, height],                
                [ w_span/2, -length/2, height],                
                [-w_span/2, -length/2, height - 3.0],          
                [ w_span/2, -length/2, height - 3.0],          
                [-w_span/2, -length/2 - 1.0, height - 3.0],    
                [ w_span/2, -length/2 - 1.0, height - 3.0]     
            ],
            faces = [
                [0, 1, 3, 2],
                [2, 3, 5, 4],
                [0, 4, 5, 1],
                [0, 2, 4],   
                [1, 5, 3]    
            ]
        );
    }
}

module lid_box() {
    armW = max(16.0, width / 4.0);
    armT = 1.8;  
    armH = 5.8;  

    difference() {
        union() {
            difference() {
                translate([-width/2, -length/2, 0]) cube([width, length, height]);
                
                // Relief pockets so base knuckles rotate freely without hitting lid wall
                base_indices = (width < 80) ? [-1, 1] : [-2, 0, 2];
                for(i = base_indices) {
                    x_pos = i * k_span;
                    translate([x_pos, -length/2 - gap/2, height])
                    rotate([0, 90, 0])
                    cylinder(r=hr + 0.5, h=k_span + k_tol, center=true);
                }
            }
            
            // Spring-Loaded Latch Frame with Thumb Release Tab
            translate([0, length/2, 0]) {
                translate([-armW/2, 0, height - 3.0]) cube([wall, armT, armH + 3.0]);
                translate([armW/2 - wall, 0, height - 3.0]) cube([wall, armT, armH + 3.0]);
                translate([-armW/2, 0, height + armH - 2.0]) cube([armW, armT, 2.0]);
                translate([-(armW*0.7)/2, armT, height + armH - 1.8]) cube([armW*0.7, 1.8, 1.8]);

                polyhedron(
                    points = [
                        [-armW/2, 0, height - 3.0],
                        [-armW/2 + wall, 0, height - 3.0],
                        [-armW/2, armT*1.2, height - 3.0],
                        [-armW/2 + wall, armT*1.2, height - 3.0],
                        [-armW/2, 0, height + 1.5],
                        [-armW/2 + wall, 0, height + 1.5]
                    ],
                    faces = [
                        [0, 1, 3, 2], [2, 3, 5, 4], [0, 4, 5, 1], [0, 2, 4], [1, 5, 3]
                    ]
                );

                polyhedron(
                    points = [
                        [armW/2 - wall, 0, height - 3.0],
                        [armW/2, 0, height - 3.0],
                        [armW/2 - wall, armT*1.2, height - 3.0],
                        [armW/2, armT*1.2, height - 3.0],
                        [armW/2 - wall, 0, height + 1.5],
                        [armW/2, 0, height + 1.5]
                    ],
                    faces = [
                        [0, 1, 3, 2], [2, 3, 5, 4], [0, 4, 5, 1], [0, 2, 4], [1, 5, 3]
                    ]
                );
            }
        }
        
        translate([-width/2 + wall, -length/2 + wall, wall])
        cube([width - wall*2, length - wall*2, height + 1]);
        
        if (box_text != "") {
            translate([0, 0, -0.05])
            linear_extrude(0.65)
            mirror([1, 0, 0])
            text(box_text, font=font_style, size=min(width/5, length/(len(box_text)*0.8)), halign="center", valign="center");
        }
    }
}

module build_base_hinges() {
    base_indices = (width < 80) ? [-1, 1] : [-2, 0, 2];

    union() {
        for(i = base_indices) {
            x_pos = i * k_span;
            
            translate([x_pos, 0, height]) {
                // Clip knuckle top at Z=0 (world Z=height) so top rim never blocks 180-deg folding
                intersection() {
                    hull() {
                        translate([-(k_span - k_tol)/2, -wall - gap/2, -gusset_h])
                        cube([k_span - k_tol, wall, gusset_h]);

                        rotate([0, 90, 0])
                        cylinder(r=hr, h=k_span - k_tol, center=true);
                    }
                    translate([-k_span, -hr*3, -gusset_h - 1])
                    cube([k_span*2, hr*6, gusset_h + 1 + hr]);
                }
            }
        }

        // Continuous Solid Hinge Pin anchored across all base knuckles
        translate([0, 0, height])
        rotate([0, 90, 0])
        cylinder(r=pin_r, h=width - k_tol, center=true);
    }
}

module build_lid_hinges() {
    // True +Z oriented 45-degree teardrop bore (prevents top arch sag in FDM printing)
    module print_in_place_teardrop(r, len) {
        rotate([90, 0, 90])
        linear_extrude(len, center=true)
        union() {
            circle(r=r, $fn=48);
            polygon([
                [-r * 0.7071, r * 0.7071],
                [0, r * 1.38],               // True +Z 45-degree self-supporting roof apex
                [r * 0.7071, r * 0.7071]
            ]);
        }
    }

    lid_indices = (width < 80) ? [0] : [-1, 1];

    for(i = lid_indices) {
        x_pos = i * k_span;

        translate([x_pos, 0, height]) {
            difference() {
                hull() {
                    translate([-(k_span - k_tol)/2, gap/2, -gusset_h])
                    cube([k_span - k_tol, wall, gusset_h]);

                    rotate([0, 90, 0])
                    cylinder(r=hr, h=k_span - k_tol, center=true);
                }

                // Subtract +Z teardrop tunnel
                print_in_place_teardrop(bore_r, k_span + 1);
            }
        }
    }
}

main();
`;
        }

        window.downloadSCAD = function() {
            const width = document.getElementById('width').value;
            const length = document.getElementById('length').value;
            const height = document.getElementById('height').value;
            const rawText = document.getElementById('customText').value;

            const safeText = rawText.replace(/[^a-zA-Z0-9\s_-]/g, '').trim() || "BOX";
            const tempId = "BOX-" + Math.random().toString(36).substring(2, 8).toUpperCase();
            const filename = `${safeText}_${width}x${length}x${height}_${tempId}.scad`;

            const blob = new Blob([currentScadCode], { type: "text/plain" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        };

        const inputs = document.querySelectorAll('input, select');
        inputs.forEach(input => input.addEventListener('input', updateModel));

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        });

        updateModel();
        animate();
    </script>
</body>
</html>
