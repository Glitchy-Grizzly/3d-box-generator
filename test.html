<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Print-in-Place Hinged Box Studio</title>
    <link rel="icon" type="image/png" href="bear head 1024x1024.png">
    <style>
        :root {
            --bg-dark: #0f172a; --panel-bg: rgba(30, 41, 59, 0.92); --card-bg: rgba(15, 23, 42, 0.65);
            --border-color: rgba(148, 163, 184, 0.18); --neon: #f43f5e; --etsy: #f1641e;
            --etsy-hover: #ff7d3b; --accent: #38bdf8; --text-main: #f8fafc; --text-muted: #94a3b8;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0; padding: 0; display: flex; height: 100vh; width: 100vw; overflow: hidden;
            font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg-dark); color: var(--text-main);
        }
        #sidebar {
            width: 390px; min-width: 390px; background: var(--panel-bg); backdrop-filter: blur(16px);
            border-right: 1px solid var(--border-color); padding: 18px;
            box-shadow: 10px 0 30px rgba(0,0,0,0.5); overflow-y: auto; z-index: 10;
            display: flex; flex-direction: column; gap: 12px;
        }
        #sidebar::-webkit-scrollbar { width: 6px; }
        #sidebar::-webkit-scrollbar-thumb { background: rgba(148,163,184,0.3); border-radius: 3px; }
        .brand-header { text-align: center; padding-bottom: 6px; border-bottom: 1px solid var(--border-color); }
        .brand-header h1 {
            font-size: 1.25rem; font-weight: 800; margin: 0; letter-spacing: 1px; text-transform: uppercase;
            background: linear-gradient(90deg, #fff, #94a3b8); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .brand-header p { margin: 2px 0 0; font-size: 0.75rem; color: var(--text-muted); }
        .section-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 10px; padding: 10px 12px; }
        .section-title {
            font-size: 0.72rem; text-transform: uppercase; letter-spacing: 1.2px; color: var(--accent);
            font-weight: 700; margin-bottom: 8px; display: flex; justify-content: space-between;
        }
        .control-group { margin-bottom: 8px; }
        .control-group:last-child { margin-bottom: 0; }
        label { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; font-weight: 600; font-size: 0.82rem; color: #cbd5e1; }
        .value-badge {
            background: rgba(244, 63, 94, 0.15); color: #fda4af; border: 1px solid rgba(244, 63, 94, 0.3);
            padding: 2px 7px; border-radius: 999px; font-size: 0.73rem; font-weight: 700;
        }
        .char-hint { font-size: 0.7rem; color: var(--text-muted); margin-top: 3px; display: flex; justify-content: space-between; }
        input[type="range"] { -webkit-appearance: none; appearance: none; width: 100%; height: 8px; background: #334155; border-radius: 4px; outline: none; cursor: pointer; }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none; width: 20px; height: 20px; border-radius: 50%;
            background: var(--neon); border: 2px solid #fff; box-shadow: 0 0 8px rgba(244,63,94,0.6);
        }
        input[type="text"], select {
            width: 100%; padding: 9px 10px; background: #0f172a; border: 1px solid var(--border-color);
            color: var(--text-main); border-radius: 6px; font-size: 0.88rem; outline: none;
        }
        .color-row { display: flex; align-items: center; gap: 8px; }
        .color-swatch { width: 26px; height: 26px; border-radius: 6px; border: 2px solid rgba(255,255,255,0.25); flex-shrink: 0; }
        .tier-card {
            background: linear-gradient(135deg, rgba(244,63,94,0.14), rgba(56,189,248,0.1));
            border: 1px solid rgba(244,63,94,0.35); border-radius: 10px; padding: 8px 12px; text-align: center;
        }
        .tier-label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); margin-bottom: 2px; }
        #recommendedTier { font-size: 0.98rem; font-weight: 800; color: #fff; }
        #closedDims { font-size: 0.72rem; color: var(--accent); margin-top: 2px; }
        .btn-group { display: flex; flex-direction: column; gap: 6px; }
        .test-row { display: flex; gap: 6px; }
        button {
            width: 100%; padding: 11px 14px; border: none; border-radius: 8px; font-size: 0.86rem;
            font-weight: 700; cursor: pointer; transition: all 0.2s ease;
        }
        .scad-btn { background-color: #334155; color: #f8fafc; border: 1px solid var(--border-color); }
        .scad-btn:hover { background-color: #475569; }
        .test-btn { background-color: rgba(56,189,248,0.15); color: #38bdf8; border: 1px solid rgba(56,189,248,0.35); font-size: 0.74rem; padding: 8px 6px; }
        .test-btn:hover { background-color: rgba(56,189,248,0.25); }
        .etsy-btn { background: linear-gradient(135deg, var(--etsy), #d9460f); color: white; }
        .etsy-btn:hover { background: linear-gradient(135deg, var(--etsy-hover), var(--etsy)); }
        #viewer { flex-grow: 1; position: relative; background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%); }
        #hud-overlay {
            position: absolute; top: 14px; right: 14px; background: var(--panel-bg); backdrop-filter: blur(12px);
            border: 1px solid var(--border-color); border-radius: 10px; padding: 10px 14px; width: 220px; z-index: 5;
        }
        .hud-hint {
            position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%);
            background: rgba(15,23,42,0.75); border: 1px solid var(--border-color);
            padding: 5px 12px; border-radius: 999px; font-size: 0.72rem; color: var(--text-muted); pointer-events: none; text-align: center; white-space: nowrap;
        }

        /* --- MOBILE RESPONSIVE MEDIA QUERY (< 768px) --- */
        @media (max-width: 768px) {
            body { flex-direction: column; height: 100vh; overflow: hidden; }
            #viewer { height: 45vh; min-height: 220px; width: 100vw; flex-grow: 0; }
            #sidebar {
                width: 100vw; min-width: 100vw; height: 55vh; flex-grow: 1;
                border-right: none; border-top: 1px solid var(--border-color);
                box-shadow: 0 -10px 30px rgba(0,0,0,0.5); padding: 14px;
            }
            #hud-overlay { top: 10px; right: 10px; width: 190px; padding: 8px 10px; }
            .hud-hint { display: none; } /* Hide desktop mouse hint on touch devices */
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div id="sidebar">
        <div class="brand-header">
            <h1>Box Studio 3D</h1>
            <p>Print-in-Place Parametric Organizer</p>
        </div>

        <div class="section-card">
            <div class="section-title">Dimensions (mm)</div>
            <div class="control-group">
                <label>Width (Hinge Axis) <span class="value-badge" id="valWidth">120 mm</span></label>
                <input type="range" id="width" min="40" max="200" value="120">
            </div>
            <div class="control-group">
                <label>Length (Each Half) <span class="value-badge" id="valLength">90 mm</span></label>
                <input type="range" id="length" min="40" max="105" value="90">
            </div>
            <div class="control-group">
                <label>Height (Each Half) <span class="value-badge" id="valHeight">20 mm</span></label>
                <input type="range" id="height" min="12" max="60" value="20">
            </div>
            <input type="hidden" id="wall" value="2.0">
        </div>

        <div class="section-card">
            <div class="section-title">Interior Grid (Base)</div>
            <div class="control-group">
                <label>Columns (X) <span class="value-badge" id="valCompX">2</span></label>
                <input type="range" id="compX" min="1" max="5" value="2">

            <div class="control-group">
                <label>Rows (Y) <span class="value-badge" id="valCompY">1</span></label>
                <input type="range" id="compY" min="1" max="5" value="1">
            </div>
        </div>

        <div class="section-card">
            <div class="section-title">Colors & Lid Inlay</div>
            <div class="control-group">
                <label for="boxColorSelect">Box Color (Bambu PLA)</label>
                <div class="color-row">
                    <div id="boxSwatch" class="color-swatch" style="background: #F5547C;"></div>
                    <select id="boxColorSelect">
                        <option value="#C12E1F">Red</option>
                        <option value="#FF6A13">Orange</option>
                        <option value="#1A1A1A">Black</option>
                        <option value="#F8FAFC">White (Jade White)</option>
                        <option value="#F4EE2A">Yellow</option>
                        <option value="#0A2989">Blue</option>
                        <option value="#3F8E43">Dark Green (Mistletoe)</option>
                        <option value="#8E9089">Gray</option>
                        <option value="#6F5034">Cocoa Brown</option>
                        <option value="#E4BD68">Gold</option>
                        <option value="#5E43B7">Purple</option>
                        <option value="#F5547C" selected>Hot Pink</option>
                    </select>
                </div>
            </div>
            <div class="control-group">
                <label for="textColorSelect">Text Inlay Color (Bambu PLA)</label>
                <div class="color-row">
                    <div id="textSwatch" class="color-swatch" style="background: #1A1A1A;"></div>
                    <select id="textColorSelect">
                        <option value="#1A1A1A" selected>Black</option>
                        <option value="#FF6A13">Orange</option>
                        <option value="#F8FAFC">White (Jade White)</option>
                        <option value="#F4EE2A">Yellow</option>
                        <option value="#C12E1F">Red</option>
                        <option value="#0A2989">Blue</option>
                        <option value="#3F8E43">Dark Green (Mistletoe)</option>
                        <option value="#8E9089">Gray</option>
                        <option value="#6F5034">Cocoa Brown</option>
                        <option value="#E4BD68">Gold</option>
                        <option value="#5E43B7">Purple</option>
                        <option value="#F5547C">Hot Pink</option>
                    </select>
                </div>

            <div class="control-group">
                <label>

            <div class="control-group">

                </select>

        <div class="tier-card">
            <div class="tier-label">Recommended Etsy Tier</div>

            <div id="closedDims">Closed Box: 120 × 90 × 40 mm</div>
        </div>

        <div class="btn-group">
            <button class="etsy-btn" onclick="saveBoxAndRedirect()">Order Custom Box on Etsy</button>
            <button class="scad-btn" onclick="downloadSCAD('full')">Download Full Multi-Part (.scad)</button>
            <div class="test-row">
                <button class="test-btn" onclick="downloadSCAD('box_only')">Box Only (.scad)</button>
                <button class="test-btn" onclick="downloadSCAD('text_only')">Text Inlay Only (.scad)</button>
            </div>
            <div class="test-row">
                <button class="test-btn" onclick="downloadSCAD('hinge')">Hinge Test (.scad)</button>
                <button class="test-btn" onclick="downloadSCAD('latch')">Latch Test (.scad)</button>
            </div>
        </div>

    <div id="viewer">
        <div id="hud-overlay">
            <div class="section-title" style="margin-bottom: 6px;">Interactive Hinge Test</div>
            <label style="font-size: 0.76rem;">
                Fold Lid <span class="value-badge" id="valFold">0° (Flat)</span>
            </label>
            <input type="range" id="foldAngle" min="0" max="180" value="0">
        </div>
        <div class="hud-hint">Touch & Drag to Rotate • Pinch to Zoom</div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { initializeAppCheck, ReCaptchaEnterpriseProvider } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app-check.js";
        
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_ID.appspot.com",
            messagingSenderId: "123456789",
            appId: "1:123456789:web:abcdef"
        };

        const app = initializeApp(firebaseConfig);

        // Initialize App Check with reCAPTCHA Enterprise
        const appCheck = initializeAppCheck(app, {
            provider: new ReCaptchaEnterpriseProvider('YOUR_RECAPTCHA_SITE_KEY_HERE'),
            isTokenAutoRefreshEnabled: true
        });

        const db = getFirestore(app);

        window.saveBoxAndRedirect = async function() {
            const boxParams = {
                shape: "rectangle",
                width: parseFloat(document.getElementById('width').value),
                length: parseFloat(document.getElementById('length').value),
                height: parseFloat(document.getElementById('height').value),
                wall: 2.0,
                compX: parseInt(document.getElementById('compX').value),
                compY: parseInt(document.getElementById('compY').value),
                boxColor: document.getElementById('boxColorSelect').value,
                textColor: document.getElementById('textColorSelect').value,
                customText: document.getElementById('customText').value,
                font: document.getElementById('fontSelect').value,
                scadCode: currentScadCode,
                createdAt: new Date().toISOString()
            };

            const designId = "BOX-" + Math.random().toString(36).substring(2, 8).toUpperCase();
            try {
                await setDoc(doc(db, "custom_boxes", designId), boxParams);
                await navigator.clipboard.writeText(designId);
                alert(`Design Code ${designId} copied to clipboard!\n\nPlease paste this code into the Personalization field on Etsy.`);
                window.location.href = "https://www.etsy.com/shop/YourShopName";
            } catch (error) {
                console.error("Error saving design to Firebase:", error);
                alert("Could not save design. Please make sure your Firebase keys are set correctly.");
            }
        };
    </script>

    <script>
        let currentScadCode = "";
        let scadVariants = {};

        const container = document.getElementById('viewer');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(42, container.clientWidth / container.clientHeight, 0.1, 1500);
        camera.position.set(130, 145, 165);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.06;

        scene.add(new THREE.HemisphereLight(0xffffff, 0x1e293b, 0.65));
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.85);
        dirLight.position.set(80, 160, 90);
        dirLight.castShadow = true;
        scene.add(dirLight);

        const rimLight = new THREE.DirectionalLight(0x38bdf8, 0.3);
        rimLight.position.set(-100, 60, -100);
        scene.add(rimLight);

        const gridHelper = new THREE.GridHelper(256, 16, 0x38bdf8, 0x334155);
        gridHelper.position.y = -0.1;
        scene.add(gridHelper);

        let boxGroup = new THREE.Group();
        scene.add(boxGroup);

        function computeSafeWrappedText(rawText, width, length, wall) {
            const usableW = width - wall * 2 - 4.0;
            const usableL = length - wall * 2 - 6.0;
            const maxCharsPerLine = Math.max(8, Math.min(18, Math.floor(usableW / 4.0)));
            const maxTotalChars = maxCharsPerLine * 2;

            const trimmed = rawText.slice(0, maxTotalChars);
            let lines = [];

            if (!trimmed.trim()) {
                return { lines: [], fontSizeMm: 8, maxCharsPerLine, maxTotalChars, clampedText: trimmed };
            }

            const textClean = trimmed.trim();
            if (textClean.length <= maxCharsPerLine) {
                lines = [textClean];
            } else {
                let splitIdx = textClean.lastIndexOf(' ', maxCharsPerLine);
                if (splitIdx <= 0) splitIdx = maxCharsPerLine;
                const line1 = textClean.slice(0, splitIdx).trim();
                const line2 = textClean.slice(splitIdx).trim().slice(0, maxCharsPerLine);
                lines = line2 ? [line1, line2] : [line1];
            }

            const longestLineChars = Math.max(...lines.map(l => l.length), 1);
            const sizeByWidth = usableW / (longestLineChars * 0.68);
            const sizeByLength = lines.length > 1 ? (usableL / 2.6) : (usableL * 0.45);
            const maxCap = Math.min(width / 4.5, 16.0);
            const fontSizeMm = Math.max(5.5, Math.min(sizeByWidth, sizeByLength, maxCap));

            return { lines, fontSizeMm, maxCharsPerLine, maxTotalChars, clampedText: trimmed };
        }

        function buildBoxHalf(w, l, h, t, cx, cy, mat) {
            const group = new THREE.Group();
            const floor = new THREE.Mesh(new THREE.BoxGeometry(w, l, t), mat);
            floor.position.set(0, 0, t / 2);
            group.add(floor);

            const left = new THREE.Mesh(new THREE.BoxGeometry(t, l, h), mat);
            left.position.set(-w / 2 + t / 2, 0, h / 2);
            group.add(left);

            const right = new THREE.Mesh(new THREE.BoxGeometry(t, l, h), mat);
            right.position.set(w / 2 - t / 2, 0, h / 2);
            group.add(right);

            const front = new THREE.Mesh(new THREE.BoxGeometry(w - t * 2, t, h), mat);
            front.position.set(0, -l / 2 + t / 2, h / 2);
            group.add(front);

            const back = new THREE.Mesh(new THREE.BoxGeometry(w - t * 2, t, h), mat);
            back.position.set(0, l / 2 - t / 2, h / 2);
            group.add(back);

            if (cx > 1) {
                const cw = (w - t * (cx + 1)) / cx;
                for (let i = 1; i < cx; i++) {
                    const div = new THREE.Mesh(new THREE.BoxGeometry(t, l - t * 2, h - t), mat);
                    div.position.set(-w / 2 + t + i * cw + (i - 0.5) * t, 0, t + (h - t) / 2);
                    group.add(div);
                }
            }
            if (cy > 1) {
                const cl = (l - t * (cy + 1)) / cy;
                for (let i = 1; i < cy; i++) {
                    const div = new THREE.Mesh(new THREE.BoxGeometry(w - t * 2, t, h - t), mat);
                    div.position.set(0, -l / 2 + t + i * cl + (i - 0.5) * t, t + (h - t) / 2);
                    group.add(div);
                }
            }
            return group;
        }

        function createWedgeMesh(w, l, h, wall, mat) {
            const armW = Math.max(16.0, w / 4.0);
            const w_span = (armW - 2 * wall) - 4.0;
            const x_min = -w_span / 2, x_max = w_span / 2;
            const y_wall = -l / 2, y_tip = -l / 2 - 1.15;
            const z_top = h, z_bot_wall = h - 3.45, z_bot_tip = h - 3.30;

            const vertices = new Float32Array([
                x_min, y_wall, z_top,       x_max, y_wall, z_top,
                x_min, y_wall, z_bot_wall,  x_max, y_wall, z_bot_wall,
                x_min, y_tip,  z_bot_tip,   x_max, y_tip,  z_bot_tip
            ]);
            const indices = [0,2,1, 1,2,3, 2,4,3, 3,4,5, 0,1,4, 1,5,4, 0,4,2, 1,3,5];
            const geo = new THREE.BufferGeometry();
            geo.setAttribute('position', new THREE.BufferAttribute(vertices, 3));
            geo.setIndex(indices);
            geo.computeVertexNormals();
            return new THREE.Mesh(geo, mat);
        }

        function updateModel() {
            const width = parseFloat(document.getElementById('width').value);
            const length = parseFloat(document.getElementById('length').value);
            const height = parseFloat(document.getElementById('height').value);
            const wall = 2.0;
            const compX = parseInt(document.getElementById('compX').value);
            const compY = parseInt(document.getElementById('compY').value);
            const boxColorHex = document.getElementById('boxColorSelect').value;
            const textColorHex = document.getElementById('textColorSelect').value;
            const textInput = document.getElementById('customText');
            const font = document.getElementById('fontSelect').value;
            const foldDeg = parseFloat(document.getElementById('foldAngle').value);

            const textData = computeSafeWrappedText(textInput.value, width, length, wall);
            textInput.maxLength = textData.maxTotalChars;
            if (textInput.value.length > textData.maxTotalChars) {
                textInput.value = textData.clampedText;
            }

            document.getElementById('charLimitBadge').innerText = `${textInput.value.length} / ${textData.maxTotalChars} chars`;
            document.getElementById('maxPerLineInfo').innerText = `Max ${textData.maxCharsPerLine}/line (2 lines max)`;
            document.getElementById('lineWrapInfo').innerText = textData.lines.length > 0
                ? `${textData.lines.length} Line${textData.lines.length > 1 ? 's' : ''} • Letter Height: ${textData.fontSizeMm.toFixed(1)} mm`
                : `No lid text`;

            document.getElementById('valWidth').innerText = `${width} mm`;
            document.getElementById('valLength').innerText = `${length} mm`;
            document.getElementById('valHeight').innerText = `${height} mm`;
            document.getElementById('valCompX').innerText = compX;
            document.getElementById('valCompY').innerText = compY;
            document.getElementById('valFold').innerText = foldDeg === 0 ? "0° (Flat)" : (foldDeg === 180 ? "180° (Closed)" : `${foldDeg}°`);
            document.getElementById('boxSwatch').style.background = boxColorHex;
            document.getElementById('textSwatch').style.background = textColorHex;

            const totalVolumeCm3 = (width * length * (height * 2)) / 1000;
            let tier = "Small Box";
            if (totalVolumeCm3 > 900) tier = "Extra Large Box";
            else if (totalVolumeCm3 > 450) tier = "Large Box";
            else if (totalVolumeCm3 > 150) tier = "Medium Box";
            if (compX > 2 || compY > 2) tier += " (+ Divider Add-on)";

            document.getElementById('recommendedTier').innerText = `${tier} (${Math.round(totalVolumeCm3)} cm³)`;
            document.getElementById('closedDims').innerText = `Closed: ${width}×${length}×${height*2} mm (Print Y: ${Math.round(length*2 + 6)} mm)`;

            scene.remove(boxGroup);
            boxGroup = new THREE.Group();

            const material = new THREE.MeshStandardMaterial({ color: new THREE.Color(boxColorHex), roughness: 0.38, metalness: 0.08 });
            const pinMaterial = new THREE.MeshStandardMaterial({ color: 0x94a3b8, roughness: 0.25, metalness: 0.5 });

            const gap = 0.90, hr = 3.20, pin_r = 1.33, k_tol = 0.35;
            const num_k = 5;
            const k_span = width / num_k;
            const base_indices = [-2, 0, 2];
            const lid_indices  = [-1, 1];

            const baseGroup = buildBoxHalf(width, length, height, wall, compX, compY, material);
            baseGroup.position.set(0, -length / 2 - gap / 2, 0);
            baseGroup.add(createWedgeMesh(width, length, height, wall, material));
            boxGroup.add(baseGroup);

            for (let i of base_indices) {
                const kGeo = new THREE.CylinderGeometry(hr, hr, k_span - k_tol, 24);
                const kMesh = new THREE.Mesh(kGeo, material);
                kMesh.rotation.z = Math.PI / 2;
                kMesh.position.set(i * k_span, 0, height);
                boxGroup.add(kMesh);
            }
            const pinMesh = new THREE.Mesh(new THREE.CylinderGeometry(pin_r, pin_r, width - k_tol, 20), pinMaterial);
            pinMesh.rotation.z = Math.PI / 2;
            pinMesh.position.set(0, 0, height);
            boxGroup.add(pinMesh);

            const lidPivot = new THREE.Group();
            lidPivot.position.set(0, 0, height);
            lidPivot.rotation.x = THREE.MathUtils.degToRad(foldDeg);

            const lidGroup = buildBoxHalf(width, length, height, wall, 1, 1, material);
            lidGroup.position.set(0, length / 2 + gap / 2, -height);

            const latchGroup = new THREE.Group();
            const armW = Math.max(16.0, width / 4.0), armT = 1.8, armH = 5.8;
            const strutL = new THREE.Mesh(new THREE.BoxGeometry(wall, armT, armH + 3.0), material);
            strutL.position.set(-armW / 2 + wall / 2, 0, height + armH / 2 - 1.5);
            latchGroup.add(strutL);

            const strutR = new THREE.Mesh(new THREE.BoxGeometry(wall, armT, armH + 3.0), material);
            strutR.position.set(armW / 2 - wall / 2, 0, height + armH / 2 - 1.5);
            latchGroup.add(strutR);

            const cap = new THREE.Mesh(new THREE.BoxGeometry(armW, armT, 2.0), material);
            cap.position.set(0, 0, height + armH - 1.0);
            latchGroup.add(cap);

            const tab = new THREE.Mesh(new THREE.BoxGeometry(armW * 0.7, 2.5, 1.8), material);
            tab.position.set(0, 1.2, height + armH - 0.9);
            latchGroup.add(tab);

            latchGroup.position.set(0, length / 2 + armT / 2, 0);
            lidGroup.add(latchGroup);
            lidPivot.add(lidGroup);

            for (let i of lid_indices) {
                const kGeo = new THREE.CylinderGeometry(hr, hr, k_span - k_tol, 24);
                const kMesh = new THREE.Mesh(kGeo, material);
                kMesh.rotation.z = Math.PI / 2;
                kMesh.position.set(i * k_span, 0, 0);
                lidPivot.add(kMesh);
            }

            if (textData.lines.length > 0) {
                const planeW = width - wall * 2;
                const planeL = length - wall * 2;
                const pxPerMm = 16;
                const canvas = document.createElement('canvas');
                canvas.width = Math.round(planeW * pxPerMm);
                canvas.height = Math.round(planeL * pxPerMm);
                const ctx = canvas.getContext('2d');

                ctx.clearRect(0, 0, canvas.width, canvas.height);
                const fontPx = Math.round(textData.fontSizeMm * pxPerMm * 1.15);
                ctx.font = `bold ${fontPx}px "${font}"`;
                ctx.fillStyle = textColorHex;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';

                const cx = canvas.width / 2;
                const cy = canvas.height / 2;
                if (textData.lines.length === 1) {
                    ctx.fillText(textData.lines[0], cx, cy);
                } else {
                    const lineStep = textData.fontSizeMm * 1.35 * pxPerMm;
                    ctx.fillText(textData.lines[0], cx, cy - lineStep / 2);
                    ctx.fillText(textData.lines[1], cx, cy + lineStep / 2);
                }

                const tex = new THREE.CanvasTexture(canvas);
                tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
                const textGeo = new THREE.PlaneGeometry(planeW, planeL);
                const textMat = new THREE.MeshBasicMaterial({ map: tex, transparent: true, side: THREE.DoubleSide });
                const textMesh = new THREE.Mesh(textGeo, textMat);
                textMesh.position.set(0, length / 2 + gap / 2, -height - 0.05);
                textMesh.rotation.x = Math.PI;
                lidPivot.add(textMesh);
            }

            boxGroup.add(lidPivot);
            boxGroup.rotation.x = -Math.PI / 2;
            scene.add(boxGroup);

            generateSCAD(width, length, height, wall, compX, compY, boxColorHex, textColorHex, textData, font, gap);
        }

        function generateSCAD(w, l, h, wall, cx, cy, boxHex, textHex, textData, font, gap) {
            const line1 = (textData.lines[0] || "").replace(/"/g, '\\"');
            const line2 = (textData.lines[1] || "").replace(/"/g, '\\"');
            const fontSizeMm = textData.fontSizeMm.toFixed(2);

            const scadBody = (mode) => `// Print-in-Place Hinged Box (Bambu P1S V12 - Responsive & Multi-Color)
export_part = "${mode}";

width = ${w};
length = ${l};
height = ${h};
wall = ${wall};
compX = ${cx};
compY = ${cy};
gap = ${gap};
$fn = 64;

box_color  = "${boxHex}";
text_color = "${textHex}";
box_text_1 = "${line1}";
box_text_2 = "${line2}";
text_size  = ${fontSizeMm};
font_style = "${font}:style=Bold";

num_k     = 5;
k_span    = width / num_k;
hr        = 3.20;
pin_r     = 1.33;
bore_r    = 1.65;
k_tol     = 0.35;
shell_clr = 0.65;
gusset_h  = 4.8;

base_indices = [-2, 0, 2];
lid_indices  = [-1, 1];

// CORRECTED: mirror([0, 1, 0]) flips Y-axis so when the lid folds 180° over the X-axis hinge,
// the text is right-side up AND reads left-to-right from the front latch!
module render_lid_text() {
    mirror([0, 1, 0]) {
        if (box_text_2 == "") {
            text(box_text_1, font=font_style, size=text_size, halign="center", valign="center");
        } else {
            line_step = text_size * 1.35;
            translate([0,  line_step/2, 0])
                text(box_text_1, font=font_style, size=text_size, halign="center", valign="center");
            translate([0, -line_step/2, 0])
                text(box_text_2, font=font_style, size=text_size, halign="center", valign="center");
        }
    }
}

module complete_model() {
    if (export_part == "hinge") {
        intersection() {
            box_body_assembly();
            translate([0, 0, height]) cube([width + 2, 24, height*2.5], center=true);
        }
    } else if (export_part == "latch") {
        intersection() {
            box_body_assembly();
            armW = max(16.0, width / 4.0);
            translate([0, 0, height]) cube([armW + 8, length*2 + 20, height*2.5], center=true);
        }
    } else if (export_part == "box_only") {
        box_body_assembly();
    } else if (export_part == "text_only") {
        text_inlay_assembly();
    } else {
        box_body_assembly();
        text_inlay_assembly();
    }
}

module box_body_assembly() {
    color(box_color) {
        union() {
            difference() {
                union() {
                    translate([0, -length/2 - gap/2, 0]) base_box();
                    build_base_hinges();
                }
                for(i = lid_indices) {
                    knuckle_cradle_cutter(i * k_span, is_base_side = true);
                }
            }
            translate([0, 0, height])
            rotate([0, 90, 0])
            cylinder(r=pin_r, h=width - k_tol, center=true);
        }

        difference() {
            union() {
                translate([0, length/2 + gap/2, 0]) lid_box();
                build_lid_hinges();
            }
            for(i = base_indices) {
                knuckle_cradle_cutter(i * k_span, is_base_side = false);
            }
            for(i = lid_indices) {
                translate([i * k_span, 0, 0])
                lid_bore_tunnel(bore_r, k_span + 0.2);
            }
        }
    }
}

module text_inlay_assembly() {
    if (box_text_1 != "") {
        color(text_color)
        translate([0, length/2 + gap/2, 0])
        linear_extrude(0.60)
        render_lid_text();
    }
}

module lid_bore_tunnel(r, len) {
    translate([0, 0, height])
    rotate([90, 0, 90])
    linear_extrude(len, center=true)
    union() {
        circle(r=r, $fn=48);
        polygon([
            [-r * 0.7071, r * 0.7071],
            [0,           r * 1.32],
            [ r * 0.7071, r * 0.7071]
        ]);
    }
}

module knuckle_cradle_cutter(x_pos, is_base_side) {
    cut_w = k_span;
    cut_r = hr + shell_clr;
    y_dir = is_base_side ? -1 : 1;

    translate([x_pos, 0, height]) {
        hull() {
            rotate([0, 90, 0]) cylinder(r=cut_r, h=cut_w, center=true);
            translate([0, 0, cut_r]) rotate([0, 90, 0]) cylinder(r=cut_r, h=cut_w, center=true);
            translate([0, y_dir * (gap/2 + 0.6), -cut_r - 1.2]) rotate([0, 90, 0]) cylinder(r=0.4, h=cut_w, center=true);
        }
    }
}

module hinge_wall_backing_rib(is_base) {
    rib_depth = 2.5;
    rib_drop  = 5.5;
    y_edge    = is_base ? (length/2 - wall) : (-length/2 + wall);
    y_inward  = is_base ? (y_edge - rib_depth) : (y_edge + rib_depth);

    hull() {
        translate([-width/2, min(y_edge, y_inward), height - rib_drop])
        cube([width, rib_depth, rib_drop]);
        translate([-width/2, is_base ? (y_edge - 0.1) : y_edge, height - rib_drop - rib_depth])
        cube([width, 0.1, 0.1]);
    }
}

module base_box() {
    union() {
        difference() {
            translate([-width/2, -length/2, 0]) cube([width, length, height]);
            comp_w = (width - wall * (compX + 1)) / compX;
            comp_l = (length - wall * (compY + 1)) / compY;
            for(i=[0:compX-1]) {
                for(j=[0:compY-1]) {
                    translate([-width/2 + wall + i*(comp_w+wall), -length/2 + wall + j*(comp_l+wall), wall])
                    cube([comp_w, comp_l, height + 1]);
                }
            }
        }
        hinge_wall_backing_rib(is_base = true);
        
        armW = max(16.0, width / 4.0);
        w_span = (armW - 2 * wall) - 4.0;
        polyhedron(
            points = [
                [-w_span/2, -length/2,        height],
                [ w_span/2, -length/2,        height],
                [-w_span/2, -length/2,        height - 3.45],
                [ w_span/2, -length/2,        height - 3.45],
                [-w_span/2, -length/2 - 1.15, height - 3.30],
                [ w_span/2, -length/2 - 1.15, height - 3.30]
            ],
            faces = [[0,1,3,2], [2,3,5,4], [0,4,5,1], [0,2,4], [1,5,3]]
        );
    }
}

module lid_box() {
    armW = max(16.0, width / 4.0);
    armT = 1.8;
    armH = 5.8;
    union() {
        difference() {
            union() {
                translate([-width/2, -length/2, 0]) cube([width, length, height]);
                translate([0, length/2, 0]) {
                    translate([-armW/2, 0, height - 3.0]) cube([wall, armT, armH + 3.0]);
                    translate([armW/2 - wall, 0, height - 3.0]) cube([wall, armT, armH + 3.0]);
                    translate([-armW/2, 0, height + armH - 2.0]) cube([armW, armT, 2.0]);
                    translate([-(armW*0.7)/2, armT, height + armH - 1.8]) cube([armW*0.7, 1.8, 1.8]);
                    polyhedron(
                        points = [
                            [-armW/2, 0, height - 3.0], [-armW/2 + wall, 0, height - 3.0],
                            [-armW/2, armT*1.2, height - 3.0], [-armW/2 + wall, armT*1.2, height - 3.0],
                            [-armW/2, 0, height + 1.5], [-armW/2 + wall, 0, height + 1.5]
                        ],
                        faces = [[0,1,3,2], [2,3,5,4], [0,4,5,1], [0,2,4], [1,5,3]]
                    );
                    polyhedron(
                        points = [
                            [armW/2 - wall, 0, height - 3.0], [armW/2, 0, height - 3.0],
                            [armW/2 - wall, armT*1.2, height - 3.0], [armW/2, armT*1.2, height - 3.0],
                            [armW/2 - wall, 0, height + 1.5], [armW/2, 0, height + 1.5]
                        ],
                        faces = [[0,1,3,2], [2,3,5,4], [0,4,5,1], [0,2,4], [1,5,3]]
                    );
                }
            }
            translate([-width/2 + wall, -length/2 + wall, wall])
            cube([width - wall*2, length - wall*2, height + 1]);
            if (box_text_1 != "") {
                translate([0, 0, -0.02])
                linear_extrude(0.64)
                offset(r=0.01)
                render_lid_text();
            }
        }
        hinge_wall_backing_rib(is_base = false);
    }
}

module build_base_hinges() {
    for(i = base_indices) {
        x_pos = i * k_span;
        k_len = k_span - k_tol;
        translate([x_pos, 0, height]) {
            union() {
                rotate([0, 90, 0]) cylinder(r=hr, h=k_len, center=true);
                hull() {
                    intersection() {
                        rotate([0, 90, 0]) cylinder(r=hr, h=k_len, center=true);
                        translate([-k_len, -hr*2, -hr*2]) cube([k_len*2, hr*2 - gap/2, hr*2]);
                    }
                    translate([-k_len/2, -wall - gap/2, -gusset_h]) cube([k_len, wall, 0.1]);
                }
            }
        }
    }
}

module build_lid_hinges() {
    for(i = lid_indices) {
        x_pos = i * k_span;
        k_len = k_span - k_tol;
        translate([x_pos, 0, height]) {
            union() {
                rotate([0, 90, 0]) cylinder(r=hr, h=k_len, center=true);
                hull() {
                    intersection() {
                        rotate([0, 90, 0]) cylinder(r=hr, h=k_len, center=true);
                        translate([-k_len, gap/2, -hr*2]) cube([k_len*2, hr*2, hr*2]);
                    }
                    translate([-k_len/2, gap/2, -gusset_h]) cube([k_len, wall, 0.1]);
                }
            }
        }
    }
}

complete_model();
`;
            currentScadCode = scadBody("full");
            scadVariants = {
                full: currentScadCode,
                box_only: scadBody("box_only"),
                text_only: scadBody("text_only"),
                hinge: scadBody("hinge"),
                latch: scadBody("latch")
            };
        }

        window.downloadSCAD = function(mode = 'full') {
            const width = document.getElementById('width').value;
            const length = document.getElementById('length').value;
            const height = document.getElementById('height').value;
            const rawText = document.getElementById('customText').value;
            const safeText = rawText.replace(/[^a-zA-Z0-9\s_-]/g, '').trim() || "BOX";
            const typeMap = {
                full: "FULL-3MF-V12",
                box_only: "BOX-ONLY-V12",
                text_only: "TEXT-ONLY-V12",
                hinge: "HINGE-TEST-V12",
                latch: "LATCH-TEST-V12"
            };
            const tempId = Math.random().toString(36).substring(2, 6).toUpperCase();
            const filename = `${safeText}_${width}x${length}x${height}_${typeMap[mode]}_${tempId}.scad`;

            const blob = new Blob([scadVariants[mode]], { type: "text/plain" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        };

        document.querySelectorAll('input, select').forEach(el => el.addEventListener('input', updateModel));

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        });

        updateModel();
        animate();
    </script>
</body>
</html>
